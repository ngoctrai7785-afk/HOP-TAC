<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Hợp Tác v47</title>
<script>
(function(){
  var target = new URL('v47.html', location.href);
  var current = new URL(location.href);
  current.searchParams.forEach(function(v,k){
    if(k!=='build') target.searchParams.set(k,v);
  });
  target.searchParams.set('build','47');
  target.hash = location.hash || '';
  location.replace(target.toString());
})();
</script>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px">
