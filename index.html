<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hợp Tác v2</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#18202a}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:75px}header{background:#fff;padding:14px 16px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:3}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:800}h1{font-size:19px;margin:0}small,.muted{color:#687180}.wrap{padding:14px}.card{background:#fff;border:1px solid #e2e5e9;border-radius:16px;padding:14px;margin-bottom:12px}.bal{font-size:27px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:12px;padding:13px 9px;font-size:15px;font-weight:700;background:#eef2f7}.blue{background:#2563eb;color:white}.green{background:#eaf8ef;color:#137333}.orange{background:#fff3e7;color:#a65300}.partner{padding:13px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px}.partner:last-child{border:0}.money{font-weight:800}.right{text-align:right}.title{font-weight:800;margin:15px 0 8px}.notice{background:#fff5e9;border:1px solid #ffd6a8;padding:10px;border-radius:12px;font-size:13px;margin-top:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:1fr 1fr;max-width:760px;margin:auto}.nav{text-align:center;padding:10px 2px;font-size:11px;color:#687180}.nav b{display:block;font-size:19px}.form label{font-size:12px;color:#687180;display:block;margin:10px 0 4px}.form input,.form select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}.back{border:0;background:none;font-size:24px}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{padding:9px 5px;border-bottom:1px solid #eee;text-align:left}
@keyframes blink{50%{transform:scale(1.04);box-shadow:0 0 0 4px rgba(220,0,0,.15)}}.pulse{animation:blink .8s infinite;font-weight:800}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="app"><header id="head"><div class="brand"><div class="logo">HT</div><div><h1>Hợp Tác</h1><small>Sổ tay đối tác · v2</small></div></div></header><main class="wrap" id="main"></main></div><div class="bottom"><div class="nav" onclick="home()"><b>👥</b>Đối tác</div><div class="nav" onclick="settings()"><b>⚙️</b>Cài đặt</div></div><script>
const SB=supabase.createClient('https://zjztapxpeiwlfkbkbynw.supabase.co','sb_publishable_kwsxebySyTEQUe4XlfiyYA_hcvh_xG0');
function device(){let x=localStorage.getItem('ht_device');if(!x){x=crypto.randomUUID();localStorage.setItem('ht_device',x)}return x}
async function recoverMe(){let n=(localStorage.getItem('ht_name')||'').trim();if(!n)return false;let {data,error}=await SB.rpc('recover_device_by_name',{p_name:n,p_device:device()});return !error&&data==='OK'}
function myname(){return localStorage.getItem('ht_name')||'Ngọc Trai'}
async function settings(){let {data,error}=await SB.rpc('get_my_profile',{p_device:device()});let p=data&&data[0]||{};let n=p.display_name||localStorage.getItem('ht_name')||'',ph=p.phone||'';document.getElementById('main').innerHTML='<div class="title">⚙️ Cài đặt</div><div class="card form"><label>Tên tài khoản</label><input id="setname" value="'+n.replace(/"/g,'&quot;')+'"><label>Số hotline</label><input id="setphone" type="tel" inputmode="tel" value="'+ph.replace(/"/g,'&quot;')+'" placeholder="Ví dụ 0912345678">'+(ph?'<a class="btn green" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="tel:'+ph.replace(/[^0-9+]/g,'')+'">☎ Gọi '+ph+'</a>':'')+'<button class="btn blue" style="width:100%;margin-top:12px" onclick="saveSettings()">Lưu cài đặt</button></div>'}
async function saveSettings(){let n=document.getElementById('setname').value.trim(),ph=document.getElementById('setphone').value.trim();if(!n)return alert('Nhập tên tài khoản');let {data,error}=await SB.rpc('update_my_profile',{p_device:device(),p_name:n,p_phone:ph});if(error||data!=='OK')return alert(error?error.message:data);localStorage.setItem('ht_name',n);alert('Đã lưu cài đặt');settings()}
async function invite(){let n=prompt('Tên của bạn',myname());if(!n)return;localStorage.setItem('ht_name',n);let {data,error}=await SB.rpc('create_invite',{p_device:device(),p_name:n});if(error)return alert('Chưa tạo được QR: '+error.message);let code=data[0].code,url=location.origin+location.pathname+'?invite='+encodeURIComponent(code);showQR(url,code)}
function showQR(url,code){document.getElementById('main').innerHTML='<div class="title">QR mời đối tác</div><div class="card" style="text-align:center"><div id="qr"></div><h2>'+code+'</h2><div class="muted">Đối tác quét mã này để liên kết với bạn.</div><button class="btn blue" style="margin-top:12px" onclick="navigator.clipboard.writeText(\''+url+'\');alert(\'Đã sao chép link\')">Sao chép link</button></div><button class="btn" onclick="home()">← Trở lại</button>';document.getElementById('qr').innerHTML='<img alt="QR" style="width:230px;max-width:80%" src="https://quickchart.io/qr?size=300&text='+encodeURIComponent(url)+'">'}
async function acceptFromLink(){let code=new URLSearchParams(location.search).get('invite');if(!code)return;let n=prompt('Nhập tên của bạn để liên kết đối tác','');if(!n)return;localStorage.setItem('ht_name',n);let {data,error}=await SB.rpc('accept_invite',{p_code:code,p_device:device(),p_name:n});alert(error?'Liên kết lỗi: '+error.message:(data==='OK'?'Đã liên kết đối tác thành công':data));history.replaceState({},'',location.pathname);await home()}
const P=[{id:'tho',n:'Ngọc Thọ',b:500000,t:'Bạn còn nợ Ngọc Thọ'},{id:'b',n:'Anh B',b:0,t:'Đã cân bằng'},{id:'vl',n:'Vi Long',b:1200000,t:'Vi Long còn nợ bạn'}];
const H={tho:[['NT001','Bếp gas mini','Cái',250000],['NT002','Nồi inox 24cm','Cái',180000]],b:[['AB001','Quạt bàn','Cái',320000]],vl:[['VL001','Bộ lau nhà','Bộ',290000]]};let cur=null;
const m=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';
async function home(){cur=null;document.getElementById('head').innerHTML='<div class="brand"><div class="logo">HT</div><div><h1>Hợp Tác</h1><small>Sổ tay đối tác · v28</small></div></div>';let live=[];try{let r=await SB.rpc('list_my_partners',{p_device:device()});if(!r.error&&r.data)live=r.data;if(!live.length&&await recoverMe()){r=await SB.rpc('list_my_partners',{p_device:device()});if(!r.error&&r.data)live=r.data}}catch(e){}let list=live.length?live.map(x=>'<div class="partner"><div style="flex:1" onclick="openLiveP(\''+x.partnership_id+'\',\''+String(x.partner_name).replace(/'/g,"\\'")+'\')"><b>'+x.partner_name+'</b><div class="muted">Đã liên kết QR · Sổ riêng 2 bên</div></div><button class="btn" style="padding:8px" onclick="event.stopPropagation();recoveryQR(\''+x.partnership_id+'\',\''+String(x.partner_name).replace(/'/g,"\\'")+'\')">▦ QR</button><button class="btn" style="padding:8px;color:#b42318" onclick="event.stopPropagation();delPartner(\''+x.partnership_id+'\',\''+String(x.partner_name).replace(/'/g,"\\'")+'\')">🗑 Xóa</button></div>').join(''):P.map(x=>'<div class="partner" onclick="openP(\''+x.id+'\')"><div><b>'+x.n+'</b><div class="muted">Dữ liệu mẫu</div></div><div class="right"><div class="money">'+m(x.b)+'</div><small>'+x.t+'</small></div></div>').join('');document.getElementById('main').innerHTML='<div class="card"><div class="muted">Sổ tay chia hàng & công nợ</div><div class="bal">'+(live.length||3)+' đối tác</div></div><div class="grid"><button class="btn blue" onclick="invite()">＋ Mời đối tác</button><button class="btn" onclick="invite()">▦ QR của tôi</button></div><div class="title">Đối tác</div><div class="card">'+list+'</div>'}
async function recoveryQR(pid,name){let {data,error}=await SB.rpc('create_partner_recovery',{p_device:device(),p_partnership:pid});if(error||!data||!data[0])return alert(error?error.message:'Không tạo được QR khôi phục');let code=data[0].code,url=location.origin+location.pathname+'?recover='+encodeURIComponent(code);document.getElementById('main').innerHTML='<div class="title">QR khôi phục · '+name+'</div><div class="card" style="text-align:center"><div id="rqr"></div><h2>'+code+'</h2><div class="notice">QR này dành riêng cho '+name+'. Dùng thành công 1 lần sẽ hết hiệu lực.</div><button class="btn blue" style="margin-top:12px" onclick="navigator.clipboard.writeText(\''+url+'\');alert(\'Đã sao chép link khôi phục\')">Sao chép link</button></div><button class="btn" onclick="home()">← Trở lại</button>';document.getElementById('rqr').innerHTML='<img alt="QR khôi phục" style="width:230px;max-width:80%" src="https://quickchart.io/qr?size=300&text='+encodeURIComponent(url)+'">'}
async function recoverFromLink(){let code=new URLSearchParams(location.search).get('recover');if(!code)return false;if(!confirm('Khôi phục tài khoản cũ trên thiết bị này?'))return true;let {data,error}=await SB.rpc('use_recovery_code',{p_code:code,p_device:device()});if(error||data!=='OK'){alert(error?error.message:'QR khôi phục không hợp lệ hoặc đã được dùng');return true}localStorage.removeItem('ht_name');let p=await SB.rpc('get_my_profile',{p_device:device()});if(p.data&&p.data[0])localStorage.setItem('ht_name',p.data[0].display_name||'');history.replaceState({},'',location.pathname);alert('Đã khôi phục tài khoản và dữ liệu cũ');await home();return true}
async function delPartner(pid,name){if(!confirm('Bạn chắc chắn muốn xóa đối tác này không?\n\nCó = Xóa    Không = Giữ lại'))return;let {data,error}=await SB.rpc('delete_partner',{p_device:device(),p_partnership:pid});if(error||data!=='OK')return alert(error?error.message:data);alert('Đã xóa đối tác');home()}
async function liveGoods(pid,name){let {data,error}=await SB.rpc('list_pair_products',{p_device:device(),p_partnership:pid});if(error)return alert(error.message);let rows=(data||[]).map(x=>'<tr><td>'+x.code+'</td><td>'+x.name+'<div class="muted">'+(x.creator_name?'Tạo bởi '+x.creator_name:'')+'</div></td><td>'+x.unit+'</td><td><b>'+m(Number(x.cost))+'</b></td><td>'+(x.can_edit?'<button class="btn" style="padding:6px 9px" onclick="editGood(\''+x.id+'\',\''+String(x.name).replace(/'/g,"\\'")+'\',\''+String(x.unit).replace(/'/g,"\\'")+'\','+Number(x.cost)+',\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">Sửa</button>':'')+'</td></tr>').join('');document.getElementById('main').innerHTML='<div class="title">Hàng hóa · '+name+'</div><button class="btn blue" onclick="addLiveGood(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">＋ Thêm hàng hóa</button><div class="card" style="margin-top:10px"><table class="table"><tr><th>Mã</th><th>Tên</th><th>ĐVT</th><th>Giá vốn</th><th></th></tr>'+rows+'</table></div><button class="btn" onclick="openLiveP(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">← Trở lại</button>'}
async function editCost(productId,oldCost,pid,name){let v=prompt('Giá vốn mới',oldCost);if(v===null)return;let n=Number(v);if(isNaN(n)||n<0)return alert('Giá không hợp lệ');let {data,error}=await SB.rpc('propose_price_change',{p_device:device(),p_product:productId,p_new_cost:n});if(error||data!=='OK')return alert(error?error.message:data);alert('Đã sửa giá vốn');liveGoods(pid,name)}
async function editGood(id,oldName,oldUnit,oldCost,pid,partner){let n=prompt('Tên hàng',oldName);if(n===null||!n.trim())return;let u=prompt('Đơn vị tính',oldUnit)||'Cái';let v=prompt('Giá vốn',oldCost);if(v===null)return;let cost=Number(v);if(isNaN(cost)||cost<0)return alert('Giá không hợp lệ');let {data,error}=await SB.rpc('edit_pair_product',{p_device:device(),p_product:id,p_name:n,p_unit:u,p_cost:cost});if(error||data!=='OK')return alert(error?error.message:data);liveGoods(pid,partner)}
async function opening(pid,name){let r=await SB.rpc('get_opening_balance',{p_device:device(),p_partnership:pid});let o=(r.data&&r.data[0])||{};document.getElementById('main').innerHTML='<div class="title">Công nợ đầu kỳ · '+name+'</div><div class="card form"><label>Chiều công nợ</label><select id="obdir"><option value="i_owe">Tôi nợ đối tác</option><option value="they_owe">Đối tác nợ tôi</option></select><label>Số tiền</label><input id="obamt" type="number" value="'+(o.amount||0)+'"><label>Ngày bắt đầu</label><input id="obdate" type="date" value="'+(o.balance_date||new Date().toISOString().slice(0,10))+'"><button class="btn blue" style="width:100%;margin-top:12px" onclick="saveOpening(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">Lưu công nợ đầu kỳ</button></div><button class="btn" onclick="openLiveP(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">← Trở lại</button>';if(o.direction)document.getElementById('obdir').value=o.direction}
async function saveOpening(pid,name){let a=Number(document.getElementById('obamt').value);let d=document.getElementById('obdir').value;let dt=document.getElementById('obdate').value;if(isNaN(a)||a<0||!dt)return alert('Kiểm tra số tiền và ngày');let {data,error}=await SB.rpc('set_opening_balance',{p_device:device(),p_partnership:pid,p_direction:d,p_amount:a,p_date:dt});if(error||data!=='OK')return alert(error?error.message:data);alert('Đã lưu công nợ đầu kỳ');openLiveP(pid,name)}
async function addLiveGood(pid,name){let n=prompt('Tên hàng');if(!n)return;let u=prompt('Đơn vị tính','Cái')||'Cái';let g=Number(prompt('Giá vốn','0'))||0;let {data,error}=await SB.rpc('add_pair_product',{p_device:device(),p_partnership:pid,p_name:n,p_unit:u,p_cost:g});if(error||data!=='OK')return alert(error?error.message:data);liveGoods(pid,name)}
async function liveOrder(pid,name){let {data,error}=await SB.rpc('list_pair_products',{p_device:device(),p_partnership:pid});if(error)return alert(error.message);let en=name.replace(/'/g,"\\'"),items=(data||[]).filter(x=>x.active!==false&&!x.can_edit);let rows=items.map(x=>'<div class="partner"><div><b>'+x.code+' · '+x.name+'</b><div class="muted">'+x.unit+' · '+m(Number(x.cost))+'</div></div><input class="oqty" data-id="'+x.id+'" type="number" min="0" value="0" style="width:72px"></div>').join('');document.getElementById('main').innerHTML='<div class="title">Đặt hàng · '+name+'</div><div class="card">'+(rows||'<div class="muted">Chưa có hàng hóa để đặt</div>')+'</div>'+(items.length?'<button class="btn green" style="width:100%" onclick="sendLiveOrder(\''+pid+'\',\''+en+'\')">Gửi đơn hàng</button>':'')+'<button class="btn" style="width:100%;margin-top:8px" onclick="openLiveP(\''+pid+'\',\''+en+'\')">← Trở lại</button>'}
async function sendLiveOrder(pid,name){let items=[...document.querySelectorAll('.oqty')].map(i=>({product_id:i.dataset.id,qty:Number(i.value)})).filter(x=>x.qty>0);if(!items.length)return alert('Chọn số lượng cần đặt');let {data,error}=await SB.rpc('create_pair_order',{p_device:device(),p_partnership:pid,p_items:items});if(error||data!=='OK')return alert(error?error.message:data);alert('Đã gửi đơn · chờ '+name+' xác nhận');openLiveP(pid,name)}
function livePay(pid,name){document.getElementById('main').innerHTML='<div class="title">Tôi trả '+name+'</div><div class="card form"><label>Số tiền</label><input id="lpamt" type="number" inputmode="numeric"><label>Hình thức</label><select id="lpm"><option value="cash">Tiền mặt</option><option value="bank">Chuyển khoản</option></select><button class="btn blue" style="width:100%;margin-top:12px" onclick="saveLivePay(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">Lưu · Chờ xác nhận</button></div><button class="btn" onclick="openLiveP(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">← Trở lại</button>'}
async function saveLivePay(pid,name){let a=Number(document.getElementById('lpamt').value);if(!a||a<=0)return alert('Nhập số tiền');let {data,error}=await SB.rpc('create_pair_payment',{p_device:device(),p_partnership:pid,p_amount:a,p_method:document.getElementById('lpm').value});if(error||data!=='OK')return alert(error?error.message:data);alert('Đã lưu khoản trả · chờ '+name+' xác nhận');openLiveP(pid,name)}
async function openLiveP(pid,name){cur=pid;let [lr,cr]=await Promise.all([SB.rpc('get_partner_ledger',{p_device:device(),p_partnership:pid}),SB.rpc('get_pair_pending_counts',{p_device:device(),p_partnership:pid})]);if(lr.error||!lr.data||!lr.data.length)return alert('Không mở được sổ');let en=String(name).replace(/'/g,"\\'"),q=(cr.data&&cr.data[0])||{},badge=n=>Number(n)>0?'<span style="display:inline-block;background:#ef2b2d;color:white;border-radius:999px;padding:2px 8px;margin-left:7px;font-size:13px">'+n+'</span>':'';document.getElementById('head').innerHTML='<div class="brand"><button class="back" onclick="home()">←</button><div><h1>'+name+'</h1><small>Đối tác · Sổ hợp tác riêng</small></div></div>';document.getElementById('main').innerHTML='<div class="grid"><button class="btn green '+(q.order_pending?'pulse':'')+'" style="min-height:86px;font-size:18px" onclick="liveOrders(\''+pid+'\',\''+en+'\')">🛒 <b>Đơn hàng</b>'+badge(q.order_pending)+'</button><button class="btn" style="min-height:86px;font-size:18px" onclick="liveGoods(\''+pid+'\',\''+en+'\')">📦 <b>Hàng hóa</b></button><button class="btn blue '+(q.payment_pending?'pulse':'')+'" style="min-height:86px;font-size:18px" onclick="paymentHub(\''+pid+'\',\''+en+'\')">💵 <b>Tôi thanh toán</b>'+badge(q.payment_pending)+'</button><button class="btn green" style="min-height:86px;font-size:18px" onclick="liveOrder(\''+pid+'\',\''+en+'\')">⊕ <b>Đặt hàng mới</b></button></div><button class="btn" style="width:100%;min-height:76px;margin-top:14px;font-size:18px" onclick="orderHistory(\''+pid+'\',\''+en+'\')">🕘 <b>Lịch sử đơn hàng</b><br><span class="muted" style="font-size:13px">Xem tối đa 50 đơn gần nhất</span></button>'}
async function paymentHub(pid,name){let {data,error}=await SB.rpc('list_pair_payments',{p_device:device(),p_partnership:pid});if(error)return alert(error.message);let en=name.replace(/'/g,"\\'"),incoming=(data||[]).filter(p=>p.my_role==='receiver'&&p.status==='pending').map(p=>'<div class="card"><b>'+p.payer_name+' báo đã thanh toán '+m(Number(p.amount))+'</b><div class="grid" style="margin-top:10px"><button class="btn green" onclick="payAct(\''+pid+'\',\''+en+'\',\''+p.payment_id+'\',\'confirmed\')">✓ Xác nhận</button><button class="btn" onclick="payAct(\''+pid+'\',\''+en+'\',\''+p.payment_id+'\',\'disputed\')">Báo sai lệch</button></div></div>').join('');document.getElementById('main').innerHTML='<div class="title">Thanh toán · '+name+'</div>'+incoming+'<button class="btn blue" style="width:100%" onclick="livePay(\''+pid+'\',\''+en+'\')">＋ Tôi thanh toán cho '+name+'</button><button class="btn" style="width:100%;margin-top:8px" onclick="openLiveP(\''+pid+'\',\''+en+'\')">← Trở lại</button>'}
async function editOrder(pid,name,id){let rows=[...document.querySelectorAll('.viewrow[data-order="'+id+'"]')];rows.forEach(r=>{r.querySelector('.vqty').disabled=false;r.querySelector('.vprice').disabled=false});document.getElementById('save-'+id).style.display='block'}
async function saveOrderEdits(order){let rows=[...document.querySelectorAll('.viewrow[data-order="'+order+'"]')];for(let r of rows){let q=Number(r.querySelector('.vqty').value),p=Number(r.querySelector('.vprice').value);let {data,error}=await SB.rpc('update_pending_order_item',{p_device:device(),p_order:order,p_product:r.dataset.product,p_qty:q,p_unit_cost:p});if(error||data!=='OK')return alert(error?error.message:'Không sửa được đơn')}return true}
async function orderAct(pid,name,id){if(!await saveOrderEdits(id))return;let {data,error}=await SB.rpc('finalize_pair_order',{p_device:device(),p_order:id});if(error||data!=='OK')return alert(error?error.message:'Không thể xác nhận');alert('Đã xác nhận đơn hàng');openLiveP(pid,name)}
async function liveOrders(pid,name){let {data,error}=await SB.rpc('list_pair_orders',{p_device:device(),p_partnership:pid});if(error)return alert(error.message);let a=(data||[]).filter(x=>x.my_role==='seller'&&x.status==='pending'),en=name.replace(/'/g,"\\'"),cards=[];for(let x of a){let ir=await SB.rpc('list_order_items',{p_device:device(),p_order:x.order_id}),its=ir.data||[],total=its.reduce((z,i)=>z+Number(i.qty)*Number(i.unit_cost),0);let rows=its.map((i,k)=>'<tr class="viewrow" data-order="'+x.order_id+'" data-product="'+i.product_id+'"><td>'+(k+1)+'</td><td>'+String(i.product_id).slice(0,4).toUpperCase()+'</td><td><b>'+i.product_name+'</b></td><td><input class="vqty" disabled type="number" min="1" value="'+i.qty+'" style="width:65px;padding:7px"></td><td><input class="vprice" disabled type="number" min="0" value="'+i.unit_cost+'" style="width:105px;padding:7px"></td><td><b>'+m(Number(i.line_total))+'</b></td></tr>').join('');cards.push('<div class="card"><div class="partner"><div><b style="font-size:18px">ĐƠN HÀNG</b><div class="muted">Đối tác: '+x.buyer_name+'</div><div class="muted">'+new Date(x.created_at).toLocaleString('vi-VN')+'</div></div><button class="btn" onclick="editOrder(\''+pid+'\',\''+en+'\',\''+x.order_id+'\')">✏️ Sửa đơn</button></div><div style="overflow:auto"><table class="table"><tr><th>STT</th><th>Mã hàng</th><th>Tên hàng</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th></tr>'+rows+'</table></div><div class="partner"><b>Tổng tiền</b><div class="bal" style="font-size:22px">'+m(total)+'</div></div><button id="save-'+x.order_id+'" class="btn blue" style="width:100%;margin-bottom:8px;display:none" onclick="saveOrderEdits(\''+x.order_id+'\').then(ok=>{if(ok){alert(\'Đã lưu sửa đơn\');liveOrders(\''+pid+'\',\''+en+'\')}})">Lưu sửa đơn</button><button class="btn green" style="width:100%" onclick="orderAct(\''+pid+'\',\''+en+'\',\''+x.order_id+'\')">✓ Xác nhận đơn hàng</button></div>')}document.getElementById('main').innerHTML='<div class="title">Đơn hàng · '+name+'</div>'+(cards.join('')||'<div class="card muted">Không có đơn mới</div>')+'<button class="btn" onclick="openLiveP(\''+pid+'\',\''+en+'\')">← Trở lại</button>'}
async function orderHistory(pid,name){let {data,error}=await SB.rpc('list_pair_order_history',{p_device:device(),p_partnership:pid});if(error)return alert(error.message);let en=name.replace(/'/g,"\\'"),cards=[];for(let x of data||[]){let ir=await SB.rpc('list_order_items',{p_device:device(),p_order:x.order_id}),lines=(ir.data||[]).map(i=>'<div class="partner"><span>'+i.product_name+' · '+i.qty+' '+i.unit+'</span><b>'+m(Number(i.line_total))+'</b></div>').join('');cards.push('<div class="card"><b>'+(x.my_role==='buyer'?'Bạn đặt':'Đối tác đặt')+' · '+m(Number(x.total))+'</b><div class="muted">'+new Date(x.created_at).toLocaleString('vi-VN')+'</div>'+lines+'</div>')}document.getElementById('main').innerHTML='<div class="title">Lịch sử đơn hàng · '+name+'</div><div class="muted" style="margin-bottom:10px">Tối đa 50 đơn gần nhất của hai bên</div>'+(cards.join('')||'<div class="card muted">Chưa có lịch sử</div>')+'<button class="btn" onclick="openLiveP(\''+pid+'\',\''+en+'\')">← Trở lại</button>'}

async function payAct(pid,name,id,status){let {data,error}=await SB.rpc('confirm_pair_payment',{p_device:device(),p_payment:id,p_status:status});if(error)return alert(error.message);if(data!=='OK')return alert('Không thể xác nhận');reconLive(pid,name)}
async function reconLive(pid,name){let [sr,pr]=await Promise.all([SB.rpc('get_pair_summary',{p_device:device(),p_partnership:pid}),SB.rpc('list_pair_payments',{p_device:device(),p_partnership:pid})]);if(sr.error)return alert(sr.error.message);let x=(sr.data&&sr.data[0])||{},net=Number(x.net_debt||0),op=Number(x.opening_signed||0),en=name.replace(/'/g,"\\'");let pending=(pr.data||[]).filter(p=>p.my_role==='receiver'&&p.status==='pending').map(p=>'<div class="card"><b>'+p.payer_name+' báo đã trả '+m(Number(p.amount))+'</b><div style="margin-top:8px"><button class="btn green" onclick="payAct(\''+pid+'\',\''+en+'\',\''+p.payment_id+'\',\'confirmed\')">Xác nhận</button> <button class="btn" onclick="payAct(\''+pid+'\',\''+en+'\',\''+p.payment_id+'\',\'disputed\')">Báo sai lệch</button></div></div>').join('');document.getElementById('main').innerHTML='<div class="title">Công nợ · '+name+'</div>'+pending+'<div class="card"><div class="partner"><span>Đầu kỳ</span><b>'+m(Math.abs(op))+'</b></div><div class="partner"><span>Hàng tôi nhận</span><b>＋ '+m(Number(x.received_total||0))+'</b></div><div class="partner"><span>Hàng tôi giao</span><b>− '+m(Number(x.given_total||0))+'</b></div><div class="partner"><span>Tiền tôi đã trả</span><b>− '+m(Number(x.paid_total||0))+'</b></div><div class="partner"><span>Đối tác đã trả</span><b>＋ '+m(Number(x.partner_paid_total||0))+'</b></div></div><div class="card"><div class="muted">Còn lại</div><div class="bal">'+m(Math.abs(net))+'</div><b>'+(net>0?'Bạn đang nợ '+name:net<0?name+' đang nợ bạn':'Hai bên không còn nợ')+'</b></div><button class="btn blue" style="width:100%" onclick="opening(\''+pid+'\',\''+en+'\')">Cài công nợ đầu kỳ</button><button class="btn" style="width:100%;margin-top:8px" onclick="openLiveP(\''+pid+'\',\''+en+'\')">← Trở lại</button>'}
function openP(id){cur=id;let p=P.find(x=>x.id==id);document.getElementById('head').innerHTML='<div class="brand"><button class="back" onclick="home()">←</button><div><h1>'+p.n+'</h1><small>Sổ hợp tác riêng</small></div></div>';document.getElementById('main').innerHTML='<div class="card"><div class="muted">Công nợ hiện tại</div><div class="bal">'+m(p.b)+'</div><b>'+p.t+'</b></div><div class="grid"><button class="btn" onclick="alert(\'Phiếu nhận hàng\')">📥 Nhận hàng</button><button class="btn" onclick="alert(\'Phiếu giao hàng\')">📤 Giao hàng</button><button class="btn green" onclick="order()">🛒 Đặt hàng</button><button class="btn blue" onclick="pay()">💵 Tôi trả đối tác</button><button class="btn" onclick="goods()">📦 Hàng hóa</button><button class="btn" onclick="history()">🕘 Lịch sử</button><button class="btn orange" onclick="recon()">✓ Đối soát</button></div><div class="notice"><b>Quy tắc tiền:</b> ai trả tiền thì người đó mới được tạo khoản trả. Bên nhận chỉ xác nhận hoặc báo sai lệch, không được sửa số tiền.</div>'}
function goods(){let p=P.find(x=>x.id==cur),a=H[cur];document.getElementById('main').innerHTML='<div class="title">Hàng hóa · '+p.n+'</div><button class="btn blue" onclick="addG()">＋ Thêm hàng hóa</button><div class="card" style="margin-top:10px"><table class="table"><tr><th>Mã</th><th>Tên hàng</th><th>ĐVT</th><th>Giá vốn</th></tr>'+a.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+m(x[3])+'</td></tr>').join('')+'</table></div><div class="notice">Chỉ Ngọc Trai và '+p.n+' thấy danh mục này. Đối tác khác không thấy.</div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
function addG(){let n=prompt('Tên hàng');if(!n)return;let g=+prompt('Giá vốn','100000')||0;H[cur].push(['HH'+(H[cur].length+1),n,'Cái',g]);goods()}
function order(){let a=H[cur],p=P.find(x=>x.id==cur);document.getElementById('main').innerHTML='<div class="title">Đặt hàng từ '+p.n+'</div><div class="card form"><label>Hàng hóa</label><select id="it">'+a.map((x,i)=>'<option value="'+i+'">'+x[1]+' · '+m(x[3])+'</option>').join('')+'</select><label>Số lượng</label><input id="q" type="number" value="1"><button class="btn green" style="width:100%;margin-top:12px" onclick="alert(\'Đã gửi đơn - chờ đối tác xác nhận\');openP(cur)">Gửi đơn đặt hàng</button></div><div class="notice">Giá được chốt tại thời điểm đặt; đổi giá sau này không làm thay đổi đơn cũ.</div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
function pay(){let p=P.find(x=>x.id==cur);document.getElementById('main').innerHTML='<div class="title">Tôi trả '+p.n+'</div><div class="notice">Chỉ bạn được nhập khoản tiền bạn trả. '+p.n+' không sửa được số tiền này.</div><div class="card form"><label>Số tiền</label><input type="number" inputmode="numeric"><label>Hình thức</label><select><option>Tiền mặt</option><option>Chuyển khoản</option></select><button class="btn blue" style="width:100%;margin-top:12px" onclick="alert(\'Đã tạo khoản trả - chờ đối tác xác nhận\')">Lưu · Chờ xác nhận</button></div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
function recon(){let p=P.find(x=>x.id==cur);document.getElementById('main').innerHTML='<div class="title">Đối soát · '+p.n+'</div><div class="card"><div class="partner"><span>Hàng tôi nhận</span><b>2.000.000đ</b></div><div class="partner"><span>Hàng tôi giao</span><b>1.000.000đ</b></div><div class="partner"><span>Tôi đã trả</span><b>500.000đ</b></div><div class="partner"><span>Đối tác đã trả</span><b>0đ</b></div><div class="partner"><b>Số dư ròng</b><b>500.000đ</b></div></div><div class="card"><div class="bal">500.000đ</div><b>Bạn còn nợ '+p.n+'</b></div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
function history(){document.getElementById('main').innerHTML='<div class="title">Lịch sử · Ngọc Thọ</div><div class="card"><div class="partner"><span>Nhận hàng</span><b>2.000.000đ</b></div><div class="partner"><span>Giao hàng</span><b>1.000.000đ</b></div><div class="partner"><span>Đã trả · Đã xác nhận</span><b>500.000đ</b></div></div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
home();recoverFromLink().then(done=>{if(!done)acceptFromLink()});
</script></body></html>
