*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#18202a}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:75px}header{background:#fff;padding:14px 16px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:3}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:800}h1{font-size:19px;margin:0}small,.muted{color:#687180}.wrap{padding:14px}.card{background:#fff;border:1px solid #e2e5e9;border-radius:16px;padding:14px;margin-bottom:12px}.bal{font-size:27px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:12px;padding:13px 9px;font-size:15px;font-weight:700;background:#eef2f7}.blue{background:#2563eb;color:white}.green{background:#eaf8ef;color:#137333}.orange{background:#fff3e7;color:#a65300}.partner{padding:13px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px}.partner:last-child{border:0}.money{font-weight:800}.right{text-align:right}.title{font-weight:800;margin:15px 0 8px}.notice{background:#fff5e9;border:1px solid #ffd6a8;padding:10px;border-radius:12px;font-size:13px;margin-top:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:1fr 1fr;max-width:760px;margin:auto}.nav{text-align:center;padding:10px 2px;font-size:11px;color:#687180}.nav b{display:block;font-size:19px}.form label{font-size:12px;color:#687180;display:block;margin:10px 0 4px}.form input,.form select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}.back{border:0;background:none;font-size:24px}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{padding:9px 5px;border-bottom:1px solid #eee;text-align:left}
@keyframes blink{50%{transform:scale(1.04);box-shadow:0 0 0 4px rgba(220,0,0,.15)}}.pulse{animation:blink .8s infinite;font-weight:800}
.homeTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.owner{background:#eef6ff;border:1px solid #cfe3ff;border-radius:16px;padding:8px 12px;font-weight:800}.searchrow{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;margin:12px 0}.partnerSelect{width:100%;padding:14px;border:1px solid #cfd8e5;border-radius:14px;font-size:16px;background:#fff}.dashgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dash{min-height:112px;border:0;border-radius:20px;padding:12px 7px;color:white;font-weight:800;font-size:16px;box-shadow:0 6px 14px #0002, inset 0 1px 0 #fff8;transition:.15s}.dash span{display:block;font-size:29px;margin-bottom:6px}.dash:disabled{filter:grayscale(1);opacity:.35;box-shadow:none}.d1{background:linear-gradient(145deg,#19d45c,#009846)}.d2{background:linear-gradient(145deg,#ffad22,#f36b00)}.d3{background:linear-gradient(145deg,#27a9ff,#1765e8)}.d4{background:linear-gradient(145deg,#a66cff,#5d36e8)}.d5{background:linear-gradient(145deg,#20d4d1,#078ca7)}.d6{background:linear-gradient(145deg,#8fa8c4,#536d8d)}.mini3d{border:0;border-radius:14px;color:white;font-weight:800;box-shadow:0 4px 10px #0002}.qr3d{background:linear-gradient(#27b7ff,#0877e8)}.del3d{background:linear-gradient(#ff6f7d,#e9364b)}@media(max-width:520px){.app{max-width:100%}.wrap{padding:12px}.dashgrid{gap:8px}.dash{min-height:108px;font-size:14px}.owner{font-size:13px}.searchrow{grid-template-columns:1fr 58px 58px}}

.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.xbtn{border:0;background:#eef2f7;border-radius:50%;width:38px;height:38px;font-size:21px;font-weight:800}.sectionCard{background:#fff;border:1px solid #dce8f6;border-radius:18px;padding:14px;margin-top:14px;box-shadow:0 5px 15px #183b6610}.sectionTitle{font-size:17px;font-weight:850;color:#16366f;margin-bottom:10px}.noticeLine{padding:7px 0;border-bottom:1px solid #eef2f7}.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border-radius:14px;padding:10px 6px;text-align:center;background:#f4f8fd}.stat b{display:block;font-size:18px;margin:4px 0}.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.recent>div{background:#f6f9fd;border:1px solid #e2eaf4;border-radius:14px;padding:10px;font-weight:750}.footBrand{text-align:center;padding:22px 8px 8px;color:#31527f;font-size:13px}.footBrand b{font-size:16px}@media(max-width:520px){.stats4{grid-template-columns:1fr 1fr}.recent{grid-template-columns:1fr 1fr 1fr}.sectionCard{padding:12px}}

.debtHero{border-radius:22px;padding:18px;margin-bottom:14px;text-align:center;background:linear-gradient(145deg,#eaf4ff,#fff);border:1px solid #cfe1f7;box-shadow:0 8px 20px #174a8b18}.debtHero .amt{font-size:32px;font-weight:900;color:#1557a6;margin:6px 0}.payPanel{background:linear-gradient(145deg,#fff,#eef7ff);border:1px solid #cfe1f7;border-radius:20px;padding:15px;box-shadow:0 8px 20px #174a8b12}.payNow{background:linear-gradient(145deg,#35b9ff,#1268e8)!important;color:white!important;box-shadow:0 6px 14px #1268e844!important}.incomingPay{border:1px solid #b9e5ca;background:linear-gradient(145deg,#f1fff5,#fff);border-radius:18px;padding:14px;margin-bottom:12px}

.payPartner{display:flex;align-items:center;gap:14px;background:linear-gradient(145deg,#f5fbff,#e6f4ff);border:1px solid #cfe4fb;border-radius:20px;padding:16px;margin-bottom:14px}.payPartner .ico{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:31px;background:#fff;box-shadow:0 5px 15px #1268e822}.debtGreen{background:linear-gradient(145deg,#f2fff5,#e5faec);border-color:#aee5bf}.debtGreen .amt{color:#11833a}.payForm3d{background:linear-gradient(145deg,#fff,#f0f7ff);border:1px solid #cfe1f7;border-radius:20px;padding:16px;box-shadow:0 8px 22px #174a8b14}.payForm3d input,.payForm3d select{width:100%;padding:13px;border:1px solid #cbdcf0;border-radius:12px;font-size:16px;background:#fff}.payFormGrid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}.payHistory{width:100%;border-collapse:collapse}.payHistory th,.payHistory td{padding:9px 6px;border-bottom:1px solid #e7eef7;text-align:left}.okpill{background:#dff7e7;color:#137333;border-radius:999px;padding:4px 8px;font-weight:800;font-size:12px}.waitpill{background:#fff1d9;color:#a65300;border-radius:999px;padding:4px 8px;font-weight:800;font-size:12px}@media(max-width:520px){.payFormGrid{grid-template-columns:1fr}.payHistory{font-size:12px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="app"><header id="head"><div class="brand"><div class="logo">HT</div><div><h1>Hợp Tác</h1><small>Sổ tay đối tác · v2</small></div></div></header><main class="wrap" id="main"></main></div><script>
const SB=supabase.createClient('https://zjztapxpeiwlfkbkbynw.supabase.co','sb_publishable_kwsxebySyTEQUe4XlfiyYA_hcvh_xG0');
function device(){let x=localStorage.getItem('ht_device');if(!x){x=crypto.randomUUID();localStorage.setItem('ht_device',x)}return x}
async function recoverMe(){let n=(localStorage.getItem('ht_name')||'').trim();if(!n)return false;let {data,error}=await SB.rpc('recover_device_by_name',{p_name:n,p_device:device()});return !error&&data==='OK'}
function myname(){return localStorage.getItem('ht_name')||'Ngọc Trai'}
async function settings(){document.getElementById('head').innerHTML='<div class="modalHead"><b>⚙️ Cài đặt</b><button class="xbtn" onclick="home()">×</button></div>';let {data,error}=await SB.rpc('get_my_profile',{p_device:device()});let p=data&&data[0]||{};let n=p.display_name||localStorage.getItem('ht_name')||'',ph=p.phone||'';document.getElementById('main').innerHTML='<div class="title">⚙️ Cài đặt</div><div class="card form"><label>Tên tài khoản</label><input id="setname" value="'+n.replace(/"/g,'&quot;')+'"><label>Số hotline</label><input id="setphone" type="tel" inputmode="tel" value="'+ph.replace(/"/g,'&quot;')+'" placeholder="Ví dụ 0912345678">'+(ph?'<a class="btn green" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="tel:'+ph.replace(/[^0-9+]/g,'')+'">☎ Gọi '+ph+'</a>':'')+'<button class="btn blue" style="width:100%;margin-top:12px" onclick="saveSettings()">Lưu cài đặt</button></div>'}
async function saveSettings(){let n=document.getElementById('setname').value.trim(),ph=document.getElementById('setphone').value.trim();if(!n)return alert('Nhập tên tài khoản');let {data,error}=await SB.rpc('update_my_profile',{p_device:device(),p_name:n,p_phone:ph});if(error||data!=='OK')return alert(error?error.message:data);localStorage.setItem('ht_name',n);alert('Đã lưu cài đặt');settings()}
async function invite(){let n=prompt('Tên của bạn',myname());if(!n)return;localStorage.setItem('ht_name',n);let {data,error}=await SB.rpc('create_invite',{p_device:device(),p_name:n});if(error)return alert('Chưa tạo được QR: '+error.message);let code=data[0].code,url=location.origin+location.pathname+'?invite='+encodeURIComponent(code);showQR(url,code)}
function showQR(url,code){document.getElementById('main').innerHTML='<div class="title">QR mời đối tác</div><div class="card" style="text-align:center"><div id="qr"></div><h2>'+code+'</h2><div class="muted">Đối tác quét mã này để liên kết với bạn.</div><button class="btn blue" style="margin-top:12px" onclick="navigator.clipboard.writeText(\''+url+'\');alert(\'Đã sao chép link\')">Sao chép link</button></div><button class="btn" onclick="home()">← Trở lại</button>';document.getElementById('qr').innerHTML='<img alt="QR" style="width:230px;max-width:80%" src="https://quickchart.io/qr?size=300&text='+encodeURIComponent(url)+'">'}
async function acceptFromLink(){let code=new URLSearchParams(location.search).get('invite');if(!code)return;let n=prompt('Nhập tên của bạn để liên kết đối tác','');if(!n)return;localStorage.setItem('ht_name',n);let {data,error}=await SB.rpc('accept_invite',{p_code:code,p_device:device(),p_name:n});alert(error?'Liên kết lỗi: '+error.message:(data==='OK'?'Đã liên kết đối tác thành công':data));history.replaceState({},'',location.pathname);await home()}
const P=[{id:'tho',n:'Ngọc Thọ',b:500000,t:'Bạn còn nợ Ngọc Thọ'},{id:'b',n:'Anh B',b:0,t:'Đã cân bằng'},{id:'vl',n:'Vi Long',b:1200000,t:'Vi Long còn nợ bạn'}];
const H={tho:[['NT001','Bếp gas mini','Cái',250000],['NT002','Nồi inox 24cm','Cái',180000]],b:[['AB001','Quạt bàn','Cái',320000]],vl:[['VL001','Bộ lau nhà','Bộ',290000]]};let cur=null;
const m=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';
let HOME_PARTNERS=[];let HOME_SELECTED=null;
function escq(v){return String(v||'').replace(/'/g,"\\'")}
async function home(){cur=null;let [pr,r,su]=await Promise.all([SB.rpc('get_my_profile',{p_device:device()}),SB.rpc('list_my_partners',{p_device:device()}),SB.rpc('get_home_summary',{p_device:device()})]),profile=pr.data&&pr.data[0]||{},owner=profile.display_name||localStorage.getItem('ht_name')||'Chủ tài khoản';if(profile.display_name)localStorage.setItem('ht_name',profile.display_name);HOME_PARTNERS=!r.error&&r.data?r.data:[];if(!HOME_PARTNERS.length&&await recoverMe()){r=await SB.rpc('list_my_partners',{p_device:device()});HOME_PARTNERS=!r.error&&r.data?r.data:[]}let z=su.data&&su.data[0]||{},opts='<option value="">Tìm hoặc chọn đối tác...</option>'+HOME_PARTNERS.map(x=>'<option value="'+x.partnership_id+'">'+x.partner_name+'</option>').join(''),recent=HOME_PARTNERS.slice(0,3).map(x=>'<div>👤 '+x.partner_name+'<br><small>Đối tác</small></div>').join('');document.getElementById('head').innerHTML='<div class="homeTop"><div class="brand"><div class="logo">🤝</div><div><h1>SỔ TAY HỢP TÁC</h1><small>Kết nối · Hợp tác · Cùng phát triển</small></div></div><div class="owner">👤 '+owner+'<br><small>Chủ tài khoản</small></div></div>';document.getElementById('main').innerHTML='<div class="title">Chọn đối tác</div><div class="searchrow"><select id="partnerPick" class="partnerSelect" onchange="selectHomePartner(this.value)">'+opts+'</select><button id="homeQR" class="mini3d qr3d" disabled onclick="homeQR()">▦<br>QR</button><button id="homeDel" class="mini3d del3d" disabled onclick="homeDelete()">🗑<br>Xóa</button></div><div class="dashgrid"><button id="dOrder" class="dash d1" disabled onclick="homeAction(\'orders\')"><span>🛒</span>Đơn hàng<small style="color:inherit">Xem và quản lý</small></button><button id="dGoods" class="dash d2" disabled onclick="homeAction(\'goods\')"><span>📦</span>Hàng hóa<small style="color:inherit">Danh sách sản phẩm</small></button><button id="dPay" class="dash d3" disabled onclick="homeAction(\'pay\')"><span>💵</span>Thanh toán<small style="color:inherit">Báo & xác nhận</small></button><button id="dNew" class="dash d4" disabled onclick="homeAction(\'new\')"><span>➕</span>Đặt hàng<small style="color:inherit">Tạo đơn mới</small></button><button id="dHist" class="dash d5" disabled onclick="homeAction(\'history\')"><span>🕘</span>Lịch sử<small style="color:inherit">50 đơn gần nhất</small></button><button class="dash d6" onclick="settings()"><span>⚙️</span>Cài đặt<small style="color:inherit">Tài khoản</small></button></div><div id="homeInfo" class="sectionCard"><div class="sectionTitle">🏪 Đối tác hiện tại</div><b>Chưa chọn đối tác</b><div class="muted">Chọn phía trên để mở các chức năng.</div></div><div class="sectionCard"><div class="sectionTitle">🔔 Thông báo</div><div id="noticeBox"><div class="muted">Chọn đối tác để xem thông báo cần xử lý.</div></div></div><div class="sectionCard"><div class="sectionTitle">📊 Tổng quan nhanh · Hôm nay</div><div class="stats4"><div class="stat">📄<b>'+Number(z.orders_today||0)+'</b><small>Đơn hàng</small></div><div class="stat">💰<b>'+m(Number(z.paid_today||0))+'</b><small>Đã thanh toán</small></div><div class="stat">⏰<b>'+Number(z.pending_payments||0)+'</b><small>Chờ xác nhận</small></div><div class="stat">👥<b>'+Number(z.partner_count||HOME_PARTNERS.length)+'</b><small>Đối tác</small></div></div></div><div class="sectionCard"><div class="sectionTitle">👥 Đối tác gần đây</div><div class="recent">'+(recent||'<div class="muted">Chưa có đối tác</div>')+'</div></div><div class="grid" style="margin-top:14px"><button class="btn blue" onclick="invite()">＋ Mời đối tác</button><button class="btn" onclick="invite()">▦ QR của tôi</button></div><div class="footBrand">🤝 <b>Đồng hành hôm nay · Phát triển ngày mai</b><br>SỔ TAY HỢP TÁC · v32 · N Trai – Nhà phát triển</div>'}
async function selectHomePartner(pid){HOME_SELECTED=HOME_PARTNERS.find(x=>x.partnership_id===pid)||null;['homeQR','homeDel','dOrder','dGoods','dPay','dNew','dHist'].forEach(id=>document.getElementById(id).disabled=!HOME_SELECTED);if(!HOME_SELECTED){document.getElementById('homeInfo').innerHTML='<div class="sectionTitle">🏪 Đối tác hiện tại</div><b>Chưa chọn đối tác</b>';document.getElementById('noticeBox').innerHTML='<div class="muted">Chọn đối tác để xem thông báo cần xử lý.</div>';return}let q=await SB.rpc('get_pair_pending_counts',{p_device:device(),p_partnership:pid}),n=q.data&&q.data[0]||{};document.getElementById('dOrder').innerHTML='<span>🛒</span>Đơn hàng'+(Number(n.order_pending)>0?' 🔴'+n.order_pending:'')+'<small style="color:inherit">Xem và quản lý</small>';document.getElementById('dPay').innerHTML='<span>💵</span>Thanh toán'+(Number(n.payment_pending)>0?' 🔴'+n.payment_pending:'')+'<small style="color:inherit">Báo & xác nhận</small>';document.getElementById('dOrder').classList.toggle('pulse',Number(n.order_pending)>0);document.getElementById('dPay').classList.toggle('pulse',Number(n.payment_pending)>0);document.getElementById('homeInfo').innerHTML='<div class="sectionTitle">🏪 Đối tác hiện tại</div><b style="font-size:20px">'+HOME_SELECTED.partner_name+'</b><div class="muted">Sổ hợp tác riêng của hai bên</div>';let notes=[];if(Number(n.order_pending)>0)notes.push('🔴 Có '+n.order_pending+' đơn hàng mới từ '+HOME_SELECTED.partner_name);if(Number(n.payment_pending)>0)notes.push('🔵 Có '+n.payment_pending+' thanh toán cần xác nhận');document.getElementById('noticeBox').innerHTML=notes.length?notes.map(x=>'<div class="noticeLine">'+x+'</div>').join(''):'<div class="muted">Không có thông báo mới.</div>'}
function homeAction(a){if(!HOME_SELECTED)return;let p=HOME_SELECTED.partnership_id,n=HOME_SELECTED.partner_name;if(a==='orders')liveOrders(p,n);if(a==='goods')liveGoods(p,n);if(a==='pay')paymentHub(p,n);if(a==='new')liveOrder(p,n);if(a==='history')orderHistory(p,n)}
function homeQR(){if(HOME_SELECTED)recoveryQR(HOME_SELECTED.partnership_id,HOME_SELECTED.partner_name)}
function homeDelete(){if(HOME_SELECTED)delPartner(HOME_SELECTED.partnership_id,HOME_SELECTED.partner_name)}
async function recoveryQR(pid,name){document.getElementById('head').innerHTML='<div class="modalHead"><b>SỔ TAY HỢP TÁC</b><button class="xbtn" onclick="home()">×</button></div>';let {data,error}=await SB.rpc('create_partner_recovery',{p_device:device(),p_partnership:pid});if(error||!data||!data[0])return alert(error?error.message:'Không tạo được QR khôi phục');let code=data[0].code,url=location.origin+location.pathname+'?recover='+encodeURIComponent(code);document.getElementById('main').innerHTML='<div class="title">QR khôi phục · '+name+'</div><div class="card" style="text-align:center"><div id="rqr"></div><h2>'+code+'</h2><div class="notice">QR này dành riêng cho '+name+'. Dùng thành công 1 lần sẽ hết hiệu lực.</div><button class="btn blue" style="margin-top:12px" onclick="navigator.clipboard.writeText(\''+url+'\');alert(\'Đã sao chép link khôi phục\')">Sao chép link</button></div><button class="btn" onclick="home()">← Trở lại</button>';document.getElementById('rqr').innerHTML='<img alt="QR khôi phục" style="width:230px;max-width:80%" src="https://quickchart.io/qr?size=300&text='+encodeURIComponent(url)+'">'}
async function recoverFromLink(){let code=new URLSearchParams(location.search).get('recover');if(!code)return false;if(!confirm('Khôi phục tài khoản cũ trên thiết bị này?'))return true;let {data,error}=await SB.rpc('use_recovery_code',{p_code:code,p_device:device()});if(error||data!=='OK'){alert(error?error.message:'QR khôi phục không hợp lệ hoặc đã được dùng');return true}localStorage.removeItem('ht_name');let p=await SB.rpc('get_my_profile',{p_device:device()});if(p.data&&p.data[0])localStorage.setItem('ht_name',p.data[0].display_name||'');history.replaceState({},'',location.pathname);alert('Đã khôi phục tài khoản và dữ liệu cũ');await home();return true}
async function delPartner(pid,name){if(!confirm('Bạn chắc chắn muốn xóa đối tác này không?\n\nCó = Xóa    Không = Giữ lại'))return;let {data,error}=await SB.rpc('delete_partner',{p_device:device(),p_partnership:pid});if(error||data!=='OK')return alert(error?error.message:data);alert('Đã xóa đối tác');home()}
async function liveGoods(pid,name){document.getElementById('head').innerHTML='<div class="modalHead"><b>SỔ TAY HỢP TÁC</b><button class="xbtn" onclick="home()">×</button></div>';let {data,error}=await SB.rpc('list_pair_products',{p_device:device(),p_partnership:pid});if(error)return alert(error.message);let rows=(data||[]).map(x=>'<tr><td>'+x.code+'</td><td>'+x.name+'<div class="muted">'+(x.creator_name?'Tạo bởi '+x.creator_name:'')+'</div></td><td>'+x.unit+'</td><td><b>'+m(Number(x.cost))+'</b></td><td>'+(x.can_edit?'<button class="btn" style="padding:6px 9px" onclick="editGood(\''+x.id+'\',\''+String(x.name).replace(/'/g,"\\'")+'\',\''+String(x.unit).replace(/'/g,"\\'")+'\','+Number(x.cost)+',\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">Sửa</button>':'')+'</td></tr>').join('');document.getElementById('main').innerHTML='<div class="title">Hàng hóa · '+name+'</div><button class="btn blue" onclick="addLiveGood(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">＋ Thêm hàng hóa</button><div class="card" style="margin-top:10px"><table class="table"><tr><th>Mã</th><th>Tên</th><th>ĐVT</th><th>Giá vốn</th><th></th></tr>'+rows+'</table></div><button class="btn" onclick="openLiveP(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">← Trở lại</button>'}
async function editCost(productId,oldCost,pid,name){let v=prompt('Giá vốn mới',oldCost);if(v===null)return;let n=Number(v);if(isNaN(n)||n<0)return alert('Giá không hợp lệ');let {data,error}=await SB.rpc('propose_price_change',{p_device:device(),p_product:productId,p_new_cost:n});if(error||data!=='OK')return alert(error?error.message:data);alert('Đã sửa giá vốn');liveGoods(pid,name)}
async function editGood(id,oldName,oldUnit,oldCost,pid,partner){let n=prompt('Tên hàng',oldName);if(n===null||!n.trim())return;let u=prompt('Đơn vị tính',oldUnit)||'Cái';let v=prompt('Giá vốn',oldCost);if(v===null)return;let cost=Number(v);if(isNaN(cost)||cost<0)return alert('Giá không hợp lệ');let {data,error}=await SB.rpc('edit_pair_product',{p_device:device(),p_product:id,p_name:n,p_unit:u,p_cost:cost});if(error||data!=='OK')return alert(error?error.message:data);liveGoods(pid,partner)}
async function opening(pid,name){let r=await SB.rpc('get_opening_balance',{p_device:device(),p_partnership:pid});let o=(r.data&&r.data[0])||{};document.getElementById('main').innerHTML='<div class="title">Công nợ đầu kỳ · '+name+'</div><div class="card form"><label>Chiều công nợ</label><select id="obdir"><option value="i_owe">Tôi nợ đối tác</option><option value="they_owe">Đối tác nợ tôi</option></select><label>Số tiền</label><input id="obamt" type="number" value="'+(o.amount||0)+'"><label>Ngày bắt đầu</label><input id="obdate" type="date" value="'+(o.balance_date||new Date().toISOString().slice(0,10))+'"><button class="btn blue" style="width:100%;margin-top:12px" onclick="saveOpening(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">Lưu công nợ đầu kỳ</button></div><button class="btn" onclick="openLiveP(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">← Trở lại</button>';if(o.direction)document.getElementById('obdir').value=o.direction}
async function saveOpening(pid,name){let a=Number(document.getElementById('obamt').value);let d=document.getElementById('obdir').value;let dt=document.getElementById('obdate').value;if(isNaN(a)||a<0||!dt)return alert('Kiểm tra số tiền và ngày');let {data,error}=await SB.rpc('set_opening_balance',{p_device:device(),p_partnership:pid,p_direction:d,p_amount:a,p_date:dt});if(error||data!=='OK')return alert(error?error.message:data);alert('Đã lưu công nợ đầu kỳ');openLiveP(pid,name)}
async function addLiveGood(pid,name){let n=prompt('Tên hàng');if(!n)return;let u=prompt('Đơn vị tính','Cái')||'Cái';let g=Number(prompt('Giá vốn','0'))||0;let {data,error}=await SB.rpc('add_pair_product',{p_device:device(),p_partnership:pid,p_name:n,p_unit:u,p_cost:g});if(error||data!=='OK')return alert(error?error.message:data);liveGoods(pid,name)}
async function liveOrder(pid,name){document.getElementById('head').innerHTML='<div class="modalHead"><b>SỔ TAY HỢP TÁC</b><button class="xbtn" onclick="home()">×</button></div>';let {data,error}=await SB.rpc('list_pair_products',{p_device:device(),p_partnership:pid});if(error)return alert(error.message);let en=name.replace(/'/g,"\\'"),items=(data||[]).filter(x=>x.active!==false&&!x.can_edit);let rows=items.map(x=>'<div class="partner"><div><b>'+x.code+' · '+x.name+'</b><div class="muted">'+x.unit+' · '+m(Number(x.cost))+'</div></div><input class="oqty" data-id="'+x.id+'" type="number" min="0" value="0" style="width:72px"></div>').join('');document.getElementById('main').innerHTML='<div class="title">Đặt hàng · '+name+'</div><div class="card">'+(rows||'<div class="muted">Chưa có hàng hóa để đặt</div>')+'</div>'+(items.length?'<button class="btn green" style="width:100%" onclick="sendLiveOrder(\''+pid+'\',\''+en+'\')">Gửi đơn hàng</button>':'')+'<button class="btn" style="width:100%;margin-top:8px" onclick="openLiveP(\''+pid+'\',\''+en+'\')">← Trở lại</button>'}
async function sendLiveOrder(pid,name){let items=[...document.querySelectorAll('.oqty')].map(i=>({product_id:i.dataset.id,qty:Number(i.value)})).filter(x=>x.qty>0);if(!items.length)return alert('Chọn số lượng cần đặt');let {data,error}=await SB.rpc('create_pair_order',{p_device:device(),p_partnership:pid,p_items:items});if(error||data!=='OK')return alert(error?error.message:data);alert('Đã gửi đơn · chờ '+name+' xác nhận');openLiveP(pid,name)}
function livePay(pid,name){document.getElementById('head').innerHTML='<div class="modalHead"><b>SỔ TAY HỢP TÁC</b><button class="xbtn" onclick="home()">×</button></div>';document.getElementById('main').innerHTML='<div class="title">Tôi trả '+name+'</div><div class="card form"><label>Số tiền</label><input id="lpamt" type="number" inputmode="numeric"><label>Hình thức</label><select id="lpm"><option value="cash">Tiền mặt</option><option value="bank">Chuyển khoản</option></select><button class="btn blue" style="width:100%;margin-top:12px" onclick="saveLivePay(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">Lưu · Chờ xác nhận</button></div><button class="btn" onclick="openLiveP(\''+pid+'\',\''+name.replace(/'/g,"\\'")+'\')">← Trở lại</button>'}
async function saveLivePay(pid,name){let a=Number(document.getElementById('lpamt').value);if(!a||a<=0)return alert('Nhập số tiền thanh toán');let {data,error}=await SB.rpc('create_pair_payment',{p_device:device(),p_partnership:pid,p_amount:a,p_method:document.getElementById('lpm').value});if(error||data!=='OK')return alert(error?error.message:data);alert('Đã báo thanh toán · chờ '+name+' xác nhận');paymentHub(pid,name)}
async function openLiveP(pid,name){cur=pid;let [lr,cr]=await Promise.all([SB.rpc('get_partner_ledger',{p_device:device(),p_partnership:pid}),SB.rpc('get_pair_pending_counts',{p_device:device(),p_partnership:pid})]);if(lr.error||!lr.data||!lr.data.length)return alert('Không mở được sổ');let en=String(name).replace(/'/g,"\\'"),q=(cr.data&&cr.data[0])||{},badge=n=>Number(n)>0?'<span style="display:inline-block;background:#ef2b2d;color:white;border-radius:999px;padding:2px 8px;margin-left:7px;font-size:13px">'+n+'</span>':'';document.getElementById('head').innerHTML='<div class="brand"><button class="back" onclick="home()">←</button><div><h1>'+name+'</h1><small>Đối tác · Sổ hợp tác riêng</small></div></div>';document.getElementById('main').innerHTML='<div class="grid"><button class="btn green '+(q.order_pending?'pulse':'')+'" style="min-height:86px;font-size:18px" onclick="liveOrders(\''+pid+'\',\''+en+'\')">🛒 <b>Đơn hàng</b>'+badge(q.order_pending)+'</button><button class="btn" style="min-height:86px;font-size:18px" onclick="liveGoods(\''+pid+'\',\''+en+'\')">📦 <b>Hàng hóa</b></button><button class="btn blue '+(q.payment_pending?'pulse':'')+'" style="min-height:86px;font-size:18px" onclick="paymentHub(\''+pid+'\',\''+en+'\')">💵 <b>Tôi thanh toán</b>'+badge(q.payment_pending)+'</button><button class="btn green" style="min-height:86px;font-size:18px" onclick="liveOrder(\''+pid+'\',\''+en+'\')">⊕ <b>Đặt hàng mới</b></button></div><button class="btn" style="width:100%;min-height:76px;margin-top:14px;font-size:18px" onclick="orderHistory(\''+pid+'\',\''+en+'\')">🕘 <b>Lịch sử đơn hàng</b><br><span class="muted" style="font-size:13px">Xem tối đa 50 đơn gần nhất</span></button>'}
async function paymentHub(pid,name){document.getElementById('head').innerHTML='<div class="modalHead"><div><b style="font-size:20px">💵 Thanh toán · '+name+'</b><div class="muted">Quản lý công nợ và thanh toán</div></div><button class="xbtn" onclick="home()">×</button></div>';let [sr,pr]=await Promise.all([SB.rpc('get_pair_summary',{p_device:device(),p_partnership:pid}),SB.rpc('list_pair_payments',{p_device:device(),p_partnership:pid})]);if(sr.error||pr.error)return alert((sr.error||pr.error).message);let x=sr.data&&sr.data[0]||{},net=Number(x.net_debt||0),en=name.replace(/'/g,"\\'"),all=pr.data||[],incoming=all.filter(p=>p.my_role==='receiver'&&p.status==='pending'),debtText=net>0?'Bạn đang nợ '+name:net<0?name+' đang nợ bạn':'Hai bên không còn công nợ',side=net>0?'Bạn cần trả '+m(Math.abs(net))+' cho '+name:net<0?'Bạn sẽ nhận '+m(Math.abs(net))+' từ '+name:'Đã cân bằng công nợ';let pending=incoming.map(p=>'<div class="incomingPay"><b>🔔 '+p.payer_name+' báo đã thanh toán</b><div style="font-size:25px;font-weight:900;margin:8px 0">'+m(Number(p.amount))+'</div><div class="grid"><button class="btn green" onclick="payAct(\''+pid+'\',\''+en+'\',\''+p.payment_id+'\',\'confirmed\')">✓ Xác nhận</button><button class="btn" onclick="payAct(\''+pid+'\',\''+en+'\',\''+p.payment_id+'\',\'disputed\')">Báo sai lệch</button></div></div>').join('');let hist=all.slice(0,10).map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+new Date(p.created_at).toLocaleDateString('vi-VN')+'</td><td><b>'+m(Number(p.amount))+'</b></td><td>'+(p.method==='bank'?'Chuyển khoản':'Tiền mặt')+'</td><td><span class="'+(p.status==='confirmed'?'okpill':'waitpill')+'">'+(p.status==='confirmed'?'Đã xác nhận':p.status==='pending'?'Chờ xác nhận':'Sai lệch')+'</span></td></tr>').join('');document.getElementById('main').innerHTML='<div class="payPartner"><div class="ico">🤝</div><div><small>Đối tác hiện tại</small><div style="font-size:22px;font-weight:900">'+name+'</div><div class="muted">Sổ hợp tác riêng của hai bên</div></div></div><div class="debtHero '+(net<=0?'debtGreen':'')+'"><div class="muted">CÔNG NỢ ĐẾN NGÀY '+new Date().toLocaleDateString('vi-VN')+'</div><div class="amt">'+m(Math.abs(net))+'</div><b>'+debtText+'</b><div style="margin-top:10px">'+side+'</div></div>'+pending+'<div class="payForm3d"><div class="sectionTitle">💳 Ghi nhận thanh toán</div><div class="muted" style="margin-bottom:12px">Nhập số tiền và gửi cho '+name+' xác nhận</div><div class="payFormGrid"><div><label>Số tiền thanh toán</label><input id="lpamt" type="number" inputmode="numeric" placeholder="0"></div><div><label>Hình thức</label><select id="lpm"><option value="cash">💵 Tiền mặt</option><option value="bank">🏦 Chuyển khoản</option></select></div><div><label>Ngày thanh toán</label><input type="date" value="'+new Date().toISOString().slice(0,10)+'" disabled></div></div><label style="display:block;margin-top:10px">Nội dung</label><input id="lpnote" placeholder="Ví dụ: Thanh toán công nợ"><button class="btn payNow" style="width:100%;margin-top:14px;font-size:17px" onclick="saveLivePay(\''+pid+'\',\''+en+'\')">➤ THANH TOÁN<br><small style="color:white">Gửi cho '+name+' xác nhận</small></button></div><div class="notice">🔔 Khi '+name+' xác nhận thanh toán, công nợ sẽ tự động cập nhật và thông báo trên màn hình chính sẽ hết nhấp nháy.</div><div class="sectionCard"><div class="sectionTitle">📋 Lịch sử thanh toán <small>(10 giao dịch gần nhất)</small></div><div style="overflow:auto"><table class="payHistory"><tr><th>#</th><th>Ngày</th><th>Số tiền</th><th>Hình thức</th><th>Trạng thái</th></tr>'+ (hist||'<tr><td colspan="5" class="muted">Chưa có giao dịch thanh toán</td></tr>')+'</table></div></div>'}
async function editOrder(pid,name,id){let rows=[...document.querySelectorAll('.viewrow[data-order="'+id+'"]')];rows.forEach(r=>{r.querySelector('.vqty').disabled=false;r.querySelector('.vprice').disabled=false});document.getElementById('save-'+id).style.display='block'}
async function saveOrderEdits(order){let rows=[...document.querySelectorAll('.viewrow[data-order="'+order+'"]')];for(let r of rows){let q=Number(r.querySelector('.vqty').value),p=Number(r.querySelector('.vprice').value);let {data,error}=await SB.rpc('update_pending_order_item',{p_device:device(),p_order:order,p_product:r.dataset.product,p_qty:q,p_unit_cost:p});if(error||data!=='OK')return alert(error?error.message:'Không sửa được đơn')}return true}
async function orderAct(pid,name,id){if(!await saveOrderEdits(id))return;let {data,error}=await SB.rpc('finalize_pair_order',{p_device:device(),p_order:id});if(error||data!=='OK')return alert(error?error.message:'Không thể xác nhận');alert('Đã xác nhận đơn hàng');openLiveP(pid,name)}
async function liveOrders(pid,name){document.getElementById('head').innerHTML='<div class="modalHead"><b>SỔ TAY HỢP TÁC</b><button class="xbtn" onclick="home()">×</button></div>';let {data,error}=await SB.rpc('list_pair_orders',{p_device:device(),p_partnership:pid});if(error)return alert(error.message);let a=(data||[]).filter(x=>x.my_role==='seller'&&x.status==='pending'),en=name.replace(/'/g,"\\'"),cards=[];for(let x of a){let ir=await SB.rpc('list_order_items',{p_device:device(),p_order:x.order_id}),its=ir.data||[],total=its.reduce((z,i)=>z+Number(i.qty)*Number(i.unit_cost),0);let rows=its.map((i,k)=>'<tr class="viewrow" data-order="'+x.order_id+'" data-product="'+i.product_id+'"><td>'+(k+1)+'</td><td>'+String(i.product_id).slice(0,4).toUpperCase()+'</td><td><b>'+i.product_name+'</b></td><td><input class="vqty" disabled type="number" min="1" value="'+i.qty+'" style="width:65px;padding:7px"></td><td><input class="vprice" disabled type="number" min="0" value="'+i.unit_cost+'" style="width:105px;padding:7px"></td><td><b>'+m(Number(i.line_total))+'</b></td></tr>').join('');cards.push('<div class="card"><div class="partner"><div><b style="font-size:18px">ĐƠN HÀNG</b><div class="muted">Đối tác: '+x.buyer_name+'</div><div class="muted">'+new Date(x.created_at).toLocaleString('vi-VN')+'</div></div><button class="btn" onclick="editOrder(\''+pid+'\',\''+en+'\',\''+x.order_id+'\')">✏️ Sửa đơn</button></div><div style="overflow:auto"><table class="table"><tr><th>STT</th><th>Mã hàng</th><th>Tên hàng</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th></tr>'+rows+'</table></div><div class="partner"><b>Tổng tiền</b><div class="bal" style="font-size:22px">'+m(total)+'</div></div><button id="save-'+x.order_id+'" class="btn blue" style="width:100%;margin-bottom:8px;display:none" onclick="saveOrderEdits(\''+x.order_id+'\').then(ok=>{if(ok){alert(\'Đã lưu sửa đơn\');liveOrders(\''+pid+'\',\''+en+'\')}})">Lưu sửa đơn</button><button class="btn green" style="width:100%" onclick="orderAct(\''+pid+'\',\''+en+'\',\''+x.order_id+'\')">✓ Xác nhận đơn hàng</button></div>')}document.getElementById('main').innerHTML='<div class="title">Đơn hàng · '+name+'</div>'+(cards.join('')||'<div class="card muted">Không có đơn mới</div>')+'<button class="btn" onclick="openLiveP(\''+pid+'\',\''+en+'\')">← Trở lại</button>'}
async function orderHistory(pid,name){document.getElementById('head').innerHTML='<div class="modalHead"><b>SỔ TAY HỢP TÁC</b><button class="xbtn" onclick="home()">×</button></div>';let {data,error}=await SB.rpc('list_pair_order_history',{p_device:device(),p_partnership:pid});if(error)return alert(error.message);let en=name.replace(/'/g,"\\'"),cards=[];for(let x of data||[]){let ir=await SB.rpc('list_order_items',{p_device:device(),p_order:x.order_id}),lines=(ir.data||[]).map(i=>'<div class="partner"><span>'+i.product_name+' · '+i.qty+' '+i.unit+'</span><b>'+m(Number(i.line_total))+'</b></div>').join('');cards.push('<div class="card"><b>'+(x.my_role==='buyer'?'Bạn đặt':'Đối tác đặt')+' · '+m(Number(x.total))+'</b><div class="muted">'+new Date(x.created_at).toLocaleString('vi-VN')+'</div>'+lines+'</div>')}document.getElementById('main').innerHTML='<div class="title">Lịch sử đơn hàng · '+name+'</div><div class="muted" style="margin-bottom:10px">Tối đa 50 đơn gần nhất của hai bên</div>'+(cards.join('')||'<div class="card muted">Chưa có lịch sử</div>')+'<button class="btn" onclick="openLiveP(\''+pid+'\',\''+en+'\')">← Trở lại</button>'}

async function payAct(pid,name,id,status){let {data,error}=await SB.rpc('confirm_pair_payment',{p_device:device(),p_payment:id,p_status:status});if(error)return alert(error.message);if(data!=='OK')return alert('Không thể xác nhận');reconLive(pid,name)}
async function reconLive(pid,name){document.getElementById('head').innerHTML='<div class="modalHead"><b>SỔ TAY HỢP TÁC</b><button class="xbtn" onclick="home()">×</button></div>';let [sr,pr]=await Promise.all([SB.rpc('get_pair_summary',{p_device:device(),p_partnership:pid}),SB.rpc('list_pair_payments',{p_device:device(),p_partnership:pid})]);if(sr.error)return alert(sr.error.message);let x=(sr.data&&sr.data[0])||{},net=Number(x.net_debt||0),op=Number(x.opening_signed||0),en=name.replace(/'/g,"\\'");let pending=(pr.data||[]).filter(p=>p.my_role==='receiver'&&p.status==='pending').map(p=>'<div class="card"><b>'+p.payer_name+' báo đã trả '+m(Number(p.amount))+'</b><div style="margin-top:8px"><button class="btn green" onclick="payAct(\''+pid+'\',\''+en+'\',\''+p.payment_id+'\',\'confirmed\')">Xác nhận</button> <button class="btn" onclick="payAct(\''+pid+'\',\''+en+'\',\''+p.payment_id+'\',\'disputed\')">Báo sai lệch</button></div></div>').join('');document.getElementById('main').innerHTML='<div class="title">Công nợ · '+name+'</div>'+pending+'<div class="card"><div class="partner"><span>Đầu kỳ</span><b>'+m(Math.abs(op))+'</b></div><div class="partner"><span>Hàng tôi nhận</span><b>＋ '+m(Number(x.received_total||0))+'</b></div><div class="partner"><span>Hàng tôi giao</span><b>− '+m(Number(x.given_total||0))+'</b></div><div class="partner"><span>Tiền tôi đã trả</span><b>− '+m(Number(x.paid_total||0))+'</b></div><div class="partner"><span>Đối tác đã trả</span><b>＋ '+m(Number(x.partner_paid_total||0))+'</b></div></div><div class="card"><div class="muted">Còn lại</div><div class="bal">'+m(Math.abs(net))+'</div><b>'+(net>0?'Bạn đang nợ '+name:net<0?name+' đang nợ bạn':'Hai bên không còn nợ')+'</b></div><button class="btn blue" style="width:100%" onclick="opening(\''+pid+'\',\''+en+'\')">Cài công nợ đầu kỳ</button><button class="btn" style="width:100%;margin-top:8px" onclick="openLiveP(\''+pid+'\',\''+en+'\')">← Trở lại</button>'}
function openP(id){cur=id;let p=P.find(x=>x.id==id);document.getElementById('head').innerHTML='<div class="brand"><button class="back" onclick="home()">←</button><div><h1>'+p.n+'</h1><small>Sổ hợp tác riêng</small></div></div>';document.getElementById('main').innerHTML='<div class="card"><div class="muted">Công nợ hiện tại</div><div class="bal">'+m(p.b)+'</div><b>'+p.t+'</b></div><div class="grid"><button class="btn" onclick="alert(\'Phiếu nhận hàng\')">📥 Nhận hàng</button><button class="btn" onclick="alert(\'Phiếu giao hàng\')">📤 Giao hàng</button><button class="btn green" onclick="order()">🛒 Đặt hàng</button><button class="btn blue" onclick="pay()">💵 Tôi trả đối tác</button><button class="btn" onclick="goods()">📦 Hàng hóa</button><button class="btn" onclick="history()">🕘 Lịch sử</button><button class="btn orange" onclick="recon()">✓ Đối soát</button></div><div class="notice"><b>Quy tắc tiền:</b> ai trả tiền thì người đó mới được tạo khoản trả. Bên nhận chỉ xác nhận hoặc báo sai lệch, không được sửa số tiền.</div>'}
function goods(){let p=P.find(x=>x.id==cur),a=H[cur];document.getElementById('main').innerHTML='<div class="title">Hàng hóa · '+p.n+'</div><button class="btn blue" onclick="addG()">＋ Thêm hàng hóa</button><div class="card" style="margin-top:10px"><table class="table"><tr><th>Mã</th><th>Tên hàng</th><th>ĐVT</th><th>Giá vốn</th></tr>'+a.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+m(x[3])+'</td></tr>').join('')+'</table></div><div class="notice">Chỉ Ngọc Trai và '+p.n+' thấy danh mục này. Đối tác khác không thấy.</div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
function addG(){let n=prompt('Tên hàng');if(!n)return;let g=+prompt('Giá vốn','100000')||0;H[cur].push(['HH'+(H[cur].length+1),n,'Cái',g]);goods()}
function order(){let a=H[cur],p=P.find(x=>x.id==cur);document.getElementById('main').innerHTML='<div class="title">Đặt hàng từ '+p.n+'</div><div class="card form"><label>Hàng hóa</label><select id="it">'+a.map((x,i)=>'<option value="'+i+'">'+x[1]+' · '+m(x[3])+'</option>').join('')+'</select><label>Số lượng</label><input id="q" type="number" value="1"><button class="btn green" style="width:100%;margin-top:12px" onclick="alert(\'Đã gửi đơn - chờ đối tác xác nhận\');openP(cur)">Gửi đơn đặt hàng</button></div><div class="notice">Giá được chốt tại thời điểm đặt; đổi giá sau này không làm thay đổi đơn cũ.</div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
function pay(){let p=P.find(x=>x.id==cur);document.getElementById('main').innerHTML='<div class="title">Tôi trả '+p.n+'</div><div class="notice">Chỉ bạn được nhập khoản tiền bạn trả. '+p.n+' không sửa được số tiền này.</div><div class="card form"><label>Số tiền</label><input type="number" inputmode="numeric"><label>Hình thức</label><select><option>Tiền mặt</option><option>Chuyển khoản</option></select><button class="btn blue" style="width:100%;margin-top:12px" onclick="alert(\'Đã tạo khoản trả - chờ đối tác xác nhận\')">Lưu · Chờ xác nhận</button></div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
function recon(){let p=P.find(x=>x.id==cur);document.getElementById('main').innerHTML='<div class="title">Đối soát · '+p.n+'</div><div class="card"><div class="partner"><span>Hàng tôi nhận</span><b>2.000.000đ</b></div><div class="partner"><span>Hàng tôi giao</span><b>1.000.000đ</b></div><div class="partner"><span>Tôi đã trả</span><b>500.000đ</b></div><div class="partner"><span>Đối tác đã trả</span><b>0đ</b></div><div class="partner"><b>Số dư ròng</b><b>500.000đ</b></div></div><div class="card"><div class="bal">500.000đ</div><b>Bạn còn nợ '+p.n+'</b></div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
function history(){document.getElementById('main').innerHTML='<div class="title">Lịch sử · Ngọc Thọ</div><div class="card"><div class="partner"><span>Nhận hàng</span><b>2.000.000đ</b></div><div class="partner"><span>Giao hàng</span><b>1.000.000đ</b></div><div class="partner"><span>Đã trả · Đã xác nhận</span><b>500.000đ</b></div></div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
home();recoverFromLink().then(done=>{if(!done)acceptFromLink()});
</script></body></html>
