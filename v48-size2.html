function device(){let x=localStorage.getItem('ht_device');if(!x){x=crypto.randomUUID();localStorage.setItem('ht_device',x)}return x}

async function saveSettings(){let n=document.getElementById('setname').value.trim(),ph=document.getElementById('setphone').value.trim();if(!n)return alert('Nhập tên tài khoản');let {data,error}=await SB.rpc('update_my_profile',{p_device:device(),p_name:n,p_phone:ph});if(error||data!=='OK')return alert(error?error.message:data);localStorage.setItem('ht_name',n);alert('Đã lưu cài đặt');settings()}
async function invite(){let n=prompt('Tên của bạn',myname());if(!n)return;localStorage.setItem('ht_name',n);let {data,error}=await SB.rpc('create_invite',{p_device:device(),p_name:n});if(error)return alert('Chưa tạo được QR: '+error.message);let code=data[0].code,url=location.origin+location.pathname+'?invite='+encodeURIComponent(code);showQR(url,code)}

}

}

  const n=moneyVal(el.value);
  el.value=n?String(n):'';

let HOME_PARTNERS=[];let HOME_SELECTED=null;
function escq(v){return String(v||'').replace(/'/g,"\\'")}
async function home(){cur=null;let [pr,r,su]=await Promise.all([SB.rpc('get_my_profile',{p_device:device()}),SB.rpc('list_my_partners',{p_device:device()}),SB.rpc('get_home_summary',{p_device:device()})]),profile=pr.data&&pr.data[0]||{},owner=profile.display_name||localStorage.getItem('ht_name')||'Chủ tài khoản';if(profile.display_name)localStorage.setItem('ht_name',profile.display_name);HOME_PARTNERS=!r.error&&r.data?r.data:[];if(!HOME_PARTNERS.length&&await recoverMe()){r=await SB.rpc('list_my_partners',{p_device:device()});HOME_PARTNERS=!r.error&&r.data?r.data:[]}let z=su.data&&su.data[0]||{},opts='<option value="">Tìm hoặc chọn đối tác...</option>'+HOME_PARTNERS.map(x=>'<option value="'+x.partnership_id+'">'+x.partner_name+'</option>').join(''),recent=HOME_PARTNERS.slice(0,3).map(x=>'<div>👤 '+x.partner_name+'<br><small>Đối tác</small></div>').join('');document.getElementById('head').innerHTML='<div class="homeTop"><div class="brand"><div class="logo">🤝</div><div><h1>SỔ TAY HỢP TÁC</h1><small>Kết nối · Hợp tác · Cùng phát triển</small></div></div><div class="owner">👤 '+owner+'<br><small>Chủ tài khoản</small></div></div>';document.getElementById('main').innerHTML='<div class="title">Chọn đối tác</div><div class="searchrow"><select id="partnerPick" class="partnerSelect" onchange="selectHomePartner(this.value)">'+opts+'</select><button id="homeQR" class="mini3d qr3d" disabled onclick="homeQR()">▦<br>QR</button><button id="homeDel" class="mini3d del3d" disabled onclick="homeDelete()">🗑<br>Xóa</button></div><div class="dashgrid"><button id="dOrder" class="dash d1" disabled onclick="homeAction(\'orders\')"><span>🛒</span>Đơn hàng<small style="color:inherit">Xem và quản lý</small></button><button id="dGoods" class="dash d2" disabled onclick="homeAction(\'goods\')"><span>📦</span>Hàng hóa<small style="color:inherit">Danh sách sản phẩm</small></button><button id="dPay" class="dash d3" disabled onclick="homeAction(\'pay\')"><span>💵</span>Thanh toán<small style="color:inherit">Báo & xác nhận</small></button><button id="dNew" class="dash d4" disabled onclick="homeAction(\'new\')"><span>➕</span>Đặt hàng<small style="color:inherit">Tạo đơn mới</small></button><button id="dHist" class="dash d5" disabled onclick="homeAction(\'history\')"><span>🕘</span>Lịch sử<small style="color:inherit">50 đơn gần nhất</small></button><button class="dash d6" onclick="settings()"><span>⚙️</span>Cài đặt<small style="color:inherit">Tài khoản</small></button></div><div id="homeInfo" class="sectionCard"><div class="sectionTitle">🏪 Đối tác hiện tại</div><b>Chưa chọn đối tác</b><div class="muted">Chọn phía trên để mở các chức năng.</div></div><div class="sectionCard"><div class="sectionTitle">🔔 Thông báo</div><div id="noticeBox"><div class="muted">Chọn đối tác để xem thông báo cần xử lý.</div></div></div><div class="sectionCard"><div class="sectionTitle">📊 Tổng quan nhanh · Hôm nay</div><div class="stats4"><div class="stat">📄<b>'+Number(z.orders_today||0)+'</b><small>Đơn hàng</small></div><div class="stat">💰<b>'+m(Number(z.paid_today||0))+'</b><small>Đã thanh toán</small></div><div class="stat">⏰<b>'+Number(z.pending_payments||0)+'</b><small>Chờ xác nhận</small></div><div class="stat">👥<b>'+Number(z.partner_count||HOME_PARTNERS.length)+'</b><small>Đối tác</small></div></div></div><div class="sectionCard"><div class="sectionTitle">👥 Đối tác gần đây</div><div class="recent">'+(recent||'<div class="muted">Chưa có đối tác</div>')+'</div></div><div class="grid" style="margin-top:14px"><button class="btn blue" onclick="invite()">＋ Mời đối tác</button><button class="btn" onclick="invite()">▦ QR của tôi</button></div><div class="footBrand">🤝 <b>Đồng hành hôm nay · Phát triển ngày mai</b><br>SỔ TAY HỢP TÁC · v48 · N Trai – Nhà phát triển</div>'}
async function selectHomePartner(pid){HOME_SELECTED=HOME_PARTNERS.find(x=>x.partnership_id===pid)||null;['homeQR','homeDel','dOrder','dGoods','dPay','dNew','dHist'].forEach(id=>document.getElementById(id).disabled=!HOME_SELECTED);if(!HOME_SELECTED){document.getElementById('homeInfo').innerHTML='<div class="sectionTitle">🏪 Đối tác hiện tại</div><b>Chưa chọn đối tác</b>';document.getElementById('noticeBox').innerHTML='<div class="muted">Chọn đối tác để xem thông báo cần xử lý.</div>';return}let q=await SB.rpc('get_pair_pending_counts',{p_device:device(),p_partnership:pid}),n=q.data&&q.data[0]||{};document.getElementById('dOrder').innerHTML='<span>🛒</span>Đơn hàng'+(Number(n.order_pending)>0?' 🔴'+n.order_pending:'')+'<small style="color:inherit">Xem và quản lý</small>';document.getElementById('dPay').innerHTML='<span>💵</span>Thanh toán'+(Number(n.payment_pending)>0?' 🔴'+n.payment_pending:'')+'<small style="color:inherit">Báo & xác nhận</small>';document.getElementById('dOrder').classList.toggle('pulse',Number(n.order_pending)>0);document.getElementById('dPay').classList.toggle('pulse',Number(n.payment_pending)>0);document.getElementById('homeInfo').innerHTML='<div class="sectionTitle">🏪 Đối tác hiện tại</div><b style="font-size:20px">'+HOME_SELECTED.partner_name+'</b><div class="muted">Sổ hợp tác riêng của hai bên</div>';let notes=[];if(Number(n.order_pending)>0)notes.push('🔴 Có '+n.order_pending+' đơn hàng mới từ '+HOME_SELECTED.partner_name);if(Number(n.payment_pending)>0)notes.push('🔵 Có '+n.payment_pending+' thanh toán cần xác nhận');document.getElementById('noticeBox').innerHTML=notes.length?notes.map(x=>'<div class="noticeLine">'+x+'</div>').join(''):'<div class="muted">Không có thông báo mới.</div>'}
async function refreshPartnerAlerts(){
  if(!HOME_SELECTED)return;
  const pid=HOME_SELECTED.partnership_id;
  try{
    let [qr,obr]=await Promise.all([
      SB.rpc('get_pair_pending_counts',{p_device:device(),p_partnership:pid}),
      SB.rpc('get_opening_proposal',{p_device:device(),p_partnership:pid})
    ]);
    if(qr.error||obr.error)return;
    let n=qr.data&&qr.data[0]||{},ob=obr.data&&obr.data[0]||{};
    let dOrder=document.getElementById('dOrder'),dPay=document.getElementById('dPay'),box=document.getElementById('noticeBox');
    if(dOrder){
      dOrder.innerHTML='<span>🛒</span>Đơn hàng'+(Number(n.order_pending)>0?' 🔴'+n.order_pending:'')+'<small style="color:inherit">Xem và quản lý</small>';
      dOrder.classList.toggle('pulse',Number(n.order_pending)>0);
    }
    if(dPay){
      dPay.innerHTML='<span>💵</span>Thanh toán'+(Number(n.payment_pending)>0?' 🔴'+n.payment_pending:'')+'<small style="color:inherit">Báo & xác nhận</small>';
      dPay.classList.toggle('pulse',Number(n.payment_pending)>0);
    }
    if(box){
      let notes=[];
      if(ob.status==='pending'&&ob.my_role==='receiver') notes.push('🔴 Nợ đầu kỳ '+m(Number(ob.amount||0))+' từ '+HOME_SELECTED.partner_name+' đang chờ bạn xác nhận');
      if(Number(n.order_pending)>0) notes.push('🔴 Có '+n.order_pending+' đơn hàng mới từ '+HOME_SELECTED.partner_name);
      let otherPay=Number(n.payment_pending||0)-((ob.status==='pending'&&ob.my_role==='receiver')?1:0);
      if(otherPay>0) notes.push('🔵 Có '+otherPay+' khoản thanh toán cần xác nhận');
      box.innerHTML=notes.length?notes.map(x=>'<div class="noticeLine">'+x+'</div>').join(''):'<div class="muted">Không có thông báo mới.</div>';
    }
  }catch(e){}

async function paymentHub(pid,name){

if(ob.status==='pending'&&ob.my_role==='receiver'){openingBox='<div class="incomingPay"><b>🔔 '+name+' đề nghị xác nhận Nợ đầu kỳ</b><div style="font-size:25px;font-weight:900;margin:8px 0">'+m(Number(ob.amount||0))+'</div><div class="muted">Ngày đầu kỳ: '+new Date(ob.balance_date).toLocaleDateString('vi-VN')+'</div><button class="btn green" style="width:100%;margin-top:10px" onclick="confirmOpeningProposal(\''+pid+'\',\''+en+'\')">✓ Xác nhận nợ đầu kỳ</button></div>';}
else if(ob.status==='pending'&&ob.my_role==='proposer'){openingBox='<div class="sectionCard"><div class="sectionTitle">📌 Nợ đầu kỳ</div><div class="lockMsg">⏳ Đã gửi '+m(Number(ob.amount||0))+' · đang chờ '+name+' xác nhận</div></div>';}
else if(ob.status==='confirmed'){openingBox='<div class="sectionCard"><div class="sectionTitle">📌 Nợ đầu kỳ</div><div class="partner"><span>Đã xác nhận · không sửa được</span><b>'+m(Number(ob.amount||0))+'</b></div></div>';}
else{openingBox='<div class="sectionCard"><div class="sectionTitle">📌 Nợ đầu kỳ</div><div class="muted" style="margin-bottom:10px">Nhập số tiền bạn đang nợ '+name+'. Sau khi '+name+' xác nhận, số này được khóa và tính vào công nợ.</div><div class="payFormGrid"><div><label>Số tiền nợ đầu kỳ</label><input id="obamt2" type="text" inputmode="numeric" placeholder="Nhập số tiền" oninput="moneyInput(this)" onfocus="moneyFocus(this)" onblur="moneyBlur(this)"></div><div><label>Ngày đầu kỳ</label><input id="obdate2" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div style="display:flex;align-items:end"><button class="btn blue" style="width:100%" onclick="saveOpeningProposal(\''+pid+'\',\''+en+'\')">Gửi xác nhận</button></div></div></div>';}

async function saveOpeningProposal(pid,name){let a=moneyVal(document.getElementById('obamt2').value),dt=document.getElementById('obdate2').value;if(!a||a<=0||!dt)return alert('Nhập số tiền nợ đầu kỳ');let {data,error}=await SB.rpc('propose_opening_balance',{p_device:device(),p_partnership:pid,p_amount:a,p_date:dt});if(error)return alert(error.message);if(data==='LOCKED')return alert('Nợ đầu kỳ đã được xác nhận và khóa');if(data==='PENDING')return alert('Đang có nợ đầu kỳ chờ đối tác xác nhận');if(data!=='OK')return alert('Không lưu được nợ đầu kỳ: '+data);alert('Đã gửi nợ đầu kỳ · chờ '+name+' xác nhận');paymentHub(pid,name)}
async function confirmOpeningProposal(pid,name){let {data,error}=await SB.rpc('confirm_opening_balance',{p_device:device(),p_partnership:pid});if(error)return alert(error.message);if(data!=='OK'&&data!=='LOCKED')return alert('Không thể xác nhận: '+data);alert(data==='LOCKED'?'Nợ đầu kỳ đã được khóa':'Đã xác nhận nợ đầu kỳ');paymentHub(pid,name)}
async function editOrder(pid,name,id){let rows=[...document.querySelectorAll('.viewrow[data-order="'+id+'"]')];rows.forEach(r=>{r.querySelector('.vqty').disabled=false;r.querySelector('.vprice').disabled=false});document.getElementById('save-'+id).style.display='block'}
async function saveOrderEdits(order){let rows=[...document.querySelectorAll('.viewrow[data-order="'+order+'"]')];for(let r of rows){let q=Number(r.querySelector('.vqty').value),p=Number(r.querySelector('.vprice').value);let {data,error}=await SB.rpc('update_pending_order_item',{p_device:device(),p_order:order,p_product:r.dataset.product,p_qty:q,p_unit_cost:p});if(error||data!=='OK')return alert(error?error.message:'Không sửa được đơn')}return true}
async function orderAct(pid,name,id){if(!await saveOrderEdits(id))return;let {data,error}=await SB.rpc('finalize_pair_order',{p_device:device(),p_order:id});if(error||data!=='OK')return alert(error?error.message:'Không thể xác nhận');alert('Đã xác nhận đơn hàng');await home();let pick=document.getElementById('partnerPick');if(pick){pick.value=pid;await selectHomePartner(pid)}}
async function liveOrders(pid,name){document.getElementById('head').innerHTML='<div class="modalHead"><b>SỔ TAY HỢP TÁC</b><button class="xbtn" onclick="home()">×</button></div>';let {data,error}=await SB.rpc('list_pair_orders',{p_device:device(),p_partnership:pid});if(error)return alert(error.message);let a=(data||[]).filter(x=>x.my_role==='seller'&&x.status==='pending'),en=name.replace(/'/g,"\\'"),cards=[];for(let x of a){let ir=await SB.rpc('list_order_items',{p_device:device(),p_order:x.order_id}),its=ir.data||[],total=its.reduce((z,i)=>z+Number(i.qty)*Number(i.unit_cost),0);let rows=its.map((i,k)=>'<tr class="viewrow" data-order="'+x.order_id+'" data-product="'+i.product_id+'"><td>'+(k+1)+'</td><td>'+String(i.product_id).slice(0,4).toUpperCase()+'</td><td><b>'+i.product_name+'</b></td><td><input class="vqty" disabled type="number" min="1" value="'+i.qty+'" style="width:65px;padding:7px"></td><td><input class="vprice" disabled type="number" min="0" value="'+i.unit_cost+'" style="width:105px;padding:7px"></td><td><b>'+m(Number(i.line_total))+'</b></td></tr>').join('');cards.push('<div class="card"><div class="partner"><div><b style="font-size:18px">ĐƠN HÀNG</b><div class="muted">Đối tác: '+x.buyer_name+'</div><div class="muted">'+new Date(x.created_at).toLocaleString('vi-VN')+'</div></div><button class="btn" onclick="editOrder(\''+pid+'\',\''+en+'\',\''+x.order_id+'\')">✏️ Sửa đơn</button></div><div style="overflow:auto"><table class="table"><tr><th>STT</th><th>Mã hàng</th><th>Tên hàng</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th></tr>'+rows+'</table></div><div class="partner"><b>Tổng tiền</b><div class="bal" style="font-size:22px">'+m(total)+'</div></div><button id="save-'+x.order_id+'" class="btn blue" style="width:100%;margin-bottom:8px;display:none" onclick="saveOrderEdits(\''+x.order_id+'\').then(ok=>{if(ok){alert(\'Đã lưu sửa đơn\');liveOrders(\''+pid+'\',\''+en+'\')}})">Lưu sửa đơn</button><button class="btn green" style="width:100%" onclick="orderAct(\''+pid+'\',\''+en+'\',\''+x.order_id+'\')">✓ Xác nhận đơn hàng</button></div>')}document.getElementById('main').innerHTML='<div class="title">Đơn hàng · '+name+'</div>'+(cards.join('')||'<div class="card muted">Không có đơn mới</div>')+'<button class="btn" onclick="openLiveP(\''+pid+'\',\''+en+'\')">← Trở lại</button>'}

async function reconLive(pid,name){document.getElementById('head').innerHTML='<div class="modalHead"><b>SỔ TAY HỢP TÁC</b><button class="xbtn" onclick="home()">×</button></div>';let [sr,pr]=await Promise.all([SB.rpc('get_pair_summary',{p_device:device(),p_partnership:pid}),SB.rpc('list_pair_payments',{p_device:device(),p_partnership:pid})]);if(sr.error)return alert(sr.error.message);let x=(sr.data&&sr.data[0])||{},net=Number(x.net_debt||0),op=Number(x.opening_signed||0),en=name.replace(/'/g,"\\'");let pending=(pr.data||[]).filter(p=>p.my_role==='receiver'&&p.status==='pending').map(p=>'<div class="card"><b>'+p.payer_name+' báo đã trả '+m(Number(p.amount))+'</b><div style="margin-top:8px"><button class="btn green" onclick="payAct(\''+pid+'\',\''+en+'\',\''+p.payment_id+'\',\'confirmed\')">Xác nhận</button> <button class="btn" onclick="payAct(\''+pid+'\',\''+en+'\',\''+p.payment_id+'\',\'disputed\')">Báo sai lệch</button></div></div>').join('');document.getElementById('main').innerHTML='<div class="title">Công nợ · '+name+'</div>'+pending+'<div class="card"><div class="partner"><span>Đầu kỳ</span><b>'+m(Math.abs(op))+'</b></div><div class="partner"><span>Hàng tôi nhận</span><b>＋ '+m(Number(x.received_total||0))+'</b></div><div class="partner"><span>Hàng tôi giao</span><b>− '+m(Number(x.given_total||0))+'</b></div><div class="partner"><span>Tiền tôi đã trả</span><b>− '+m(Number(x.paid_total||0))+'</b></div><div class="partner"><span>Đối tác đã trả</span><b>＋ '+m(Number(x.partner_paid_total||0))+'</b></div></div><div class="card"><div class="muted">Còn lại</div><div class="bal">'+m(Math.abs(net))+'</div><b>'+(net>0?'Bạn đang nợ '+name:net<0?name+' đang nợ bạn':'Hai bên không còn nợ')+'</b></div><button class="btn blue" style="width:100%" onclick="opening(\''+pid+'\',\''+en+'\')">Cài công nợ đầu kỳ</button><button class="btn" style="width:100%;margin-top:8px" onclick="openLiveP(\''+pid+'\',\''+en+'\')">← Trở lại</button>'}

function pay(){let p=P.find(x=>x.id==cur);document.getElementById('main').innerHTML='<div class="title">Tôi trả '+p.n+'</div><div class="notice">Chỉ bạn được nhập khoản tiền bạn trả. '+p.n+' không sửa được số tiền này.</div><div class="card form"><label>Số tiền</label><input type="number" inputmode="numeric"><label>Hình thức</label><select><option>Tiền mặt</option><option>Chuyển khoản</option></select><button class="btn blue" style="width:100%;margin-top:12px" onclick="alert(\'Đã tạo khoản trả - chờ đối tác xác nhận\')">Lưu · Chờ xác nhận</button></div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
function recon(){let p=P.find(x=>x.id==cur);document.getElementById('main').innerHTML='<div class="title">Đối soát · '+p.n+'</div><div class="card"><div class="partner"><span>Hàng tôi nhận</span><b>2.000.000đ</b></div><div class="partner"><span>Hàng tôi giao</span><b>1.000.000đ</b></div><div class="partner"><span>Tôi đã trả</span><b>500.000đ</b></div><div class="partner"><span>Đối tác đã trả</span><b>0đ</b></div><div class="partner"><b>Số dư ròng</b><b>500.000đ</b></div></div><div class="card"><div class="bal">500.000đ</div><b>Bạn còn nợ '+p.n+'</b></div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
function history(){document.getElementById('main').innerHTML='<div class="title">Lịch sử · Ngọc Thọ</div><div class="card"><div class="partner"><span>Nhận hàng</span><b>2.000.000đ</b></div><div class="partner"><span>Giao hàng</span><b>1.000.000đ</b></div><div class="partner"><span>Đã trả · Đã xác nhận</span><b>500.000đ</b></div></div><button class="btn" onclick="openP(cur)">← Trở lại</button>'}
let HT_SYNC_BUSY=false;
function openAlertPartner(pid,type){let p=HOME_PARTNERS.find(x=>x.partnership_id===pid);if(!p)return;HOME_SELECTED=p;let pick=document.getElementById('partnerPick');if(pick)pick.value=pid;selectHomePartner(pid).then(()=>{if(type==='order')liveOrders(pid,p.partner_name);else paymentHub(pid,p.partner_name)})}
function seenOrderIds(){try{return JSON.parse(localStorage.getItem('ht_seen_orders')||'[]')}catch(e){return[]}}
function markOrdersSeen(ids){let s=new Set(seenOrderIds());ids.forEach(x=>s.add(x));localStorage.setItem('ht_seen_orders',JSON.stringify([...s].slice(-300)))}
async function autoSync(){if(HT_SYNC_BUSY||document.hidden)return;HT_SYNC_BUSY=true;try{let r=await SB.rpc('list_my_partners',{p_device:device()});if(!r.error&&r.data)HOME_PARTNERS=r.data;let selected=HOME_SELECTED&&HOME_SELECTED.partnership_id||document.getElementById('partnerPick')?.value||'',alerts=[],seen=new Set(seenOrderIds()),newIds=[];for(let p of HOME_PARTNERS){let or=await SB.rpc('list_pair_orders',{p_device:device(),p_partnership:p.partnership_id}),fresh=(or.data||[]).filter(o=>o.my_role==='seller'&&o.status==='pending'&&!seen.has(o.order_id));if(fresh.length){alerts.push({type:'order',p,count:fresh.length});fresh.forEach(o=>newIds.push(o.order_id))}let q=await SB.rpc('get_pair_pending_counts',{p_device:device(),p_partnership:p.partnership_id}),n=q.data&&q.data[0]||{};if(Number(n.payment_pending)>0)alerts.push({type:'pay',p,count:Number(n.payment_pending)})}if(newIds.length)markOrdersSeen(newIds);if(selected&&document.getElementById('partnerPick')){HOME_SELECTED=HOME_PARTNERS.find(x=>x.partnership_id===selected)||HOME_SELECTED;if(HOME_SELECTED)await selectHomePartner(selected)}let box=document.getElementById('noticeBox');if(box){if(alerts.length)box.innerHTML=alerts.map(a=>'<div class="noticeLine" style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div><b>'+(a.type==='order'?'🔴 '+a.p.partner_name+' có '+a.count+' đơn hàng mới':'🔵 '+a.p.partner_name+' có '+a.count+' thanh toán chờ xác nhận')+'</b></div><button class="btn '+(a.type==='order'?'green':'blue')+'" style="padding:8px 11px;white-space:nowrap" onclick="openAlertPartner(\\\''+a.p.partnership_id+'\\\',\\\''+a.type+'\\\')">XEM</button></div>').join('');else if(!selected)box.innerHTML='<div class="muted">Không có thông báo mới.</div>'}document.title=alerts.length?'🔔 Có việc mới · Sổ Hợp Tác':'Sổ Tay Hợp Tác'}catch(e){}finally{HT_SYNC_BUSY=false}}
async function ensureLatestBuild(){try{let key='ht_build_reload',u=location.pathname+'?__buildcheck='+Date.now(),t=await fetch(u,{cache:'no-store'}).then(r=>r.text()),m=t.match(/<meta name="ht-build" content="(\\d+)"/),remote=m?Number(m[1]):45,local=Number(document.querySelector('meta[name="ht-build"]')?.content||0);if(remote>local&&sessionStorage.getItem(key)!==String(remote)){sessionStorage.setItem(key,String(remote));location.replace(location.pathname+'?v='+remote+'&t='+Date.now());return false}sessionStorage.removeItem(key)}catch(e){}return true}
ensureLatestBuild().then(ok=>{if(ok){home();recoverFromLink().then(done=>{if(!done)acceptFromLink()})}});
setInterval(autoSync,5000);setTimeout(autoSync,1200);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoSync()});
</script></body></html>
